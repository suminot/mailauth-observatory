name: 公開サイトのデプロイ

# P8 が生成した site/dist を Cloudflare Pages に載せる（DESIGN.md Sprint 7）。
#
# **secrets が無ければ何もしない。** 認証情報を入れる前に動いてしまうと、
# 検査を通っていない状態のサイトが出る可能性がある。
#
# 第2層（個社名付き明細）はこのワークフローでは出さない。P8 が
# 訂正期間とアクセス制御の条件を満たさない限り停止するため、
# ここに来る dist には第1層しか入っていない。

on:
  # gold が更新されたときだけ。**人の push はこちらで拾う。**
  push:
    branches: [main]
    paths:
      - "gold/**"
      - "site/**"
      - "src/mailauth/p8_publish/**"
      # **認証の中身を直しても出ないと困る。** `functions/` は Pages の
      # middleware（Basic 認証）で、ここを外すと「直したのに掛かっていない」
      # 状態が黙って続く
      - "functions/**"
      # デプロイ手順そのものを直したときも出す
      - ".github/workflows/deploy.yml"

  # **月次ワークフローのコミットは、上の push を起こさない。**
  #
  # GitHub Actions は既定のトークンで作られた push では他のワークフローを
  # 起動しない（無限ループ防止）。ここには長らく「月次ワークフローの
  # コミットが引き金になる」と書いてあったが、**そうならない。**
  #
  # 2026-09-28、初めて gold がコミットされた日に実際に起きた ── その
  # コミットに対する実行は0件で、手で起こすまで公開されなかった。
  # **八工程が一度も最後まで通っていなかったので、誰も踏んでいなかった。**
  #
  # 工程の連鎖は workflow_run で受ける。名前で参照するので、月次側の
  # `name:` を変えるとここが黙って効かなくなる（検査で捕まえている）。
  workflow_run:
    workflows: ["月次計測"]
    types: [completed]

  workflow_dispatch:

concurrency:
  group: deploy-site
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write
  # 月次の成果物（個社別明細）を取ってくる。publish.yaml の private_drilldown
  actions: read

# **`shell: bash` を明示する。** 明示しないと Actions は `bash -e {0}` で
# 走らせ、`pipefail` が付かない ── `cmd | tee` の cmd が失敗しても
# ステップは成功になる。2026-10-18、crt.sh の DB 直結の試験が、接続を
# 断られたのに success で終わった
defaults:
  run:
    shell: bash

jobs:
  deploy:
    # **失敗した月次実行の結果を公開しない。** workflow_run は成否に
    # かかわらず飛んでくるので、成功したときだけ通す。他の引き金
    # （人の push・手動）はそのまま通す
    if: >-
      github.event_name != 'workflow_run'
      || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # **浅い clone だとビルドの表示が出ない。** 既定の深さ1では
        # `git log` が1件しか見えず、そのコミットに `(#NN)` が無ければ
        # 番号まで遡れない（月次計測のコミットがまさにそれ）。
        # observablehq.config.js が遡る件数（50）と揃える
        with:
          fetch-depth: 50

      - name: secrets の有無を確認
        id: gate
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ secrets.CLOUDFLARE_PAGES_PROJECT }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$ACCOUNT" ] || [ -z "$PROJECT" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            {
              echo "### デプロイをスキップした"
              echo
              echo "Cloudflare の認証情報が設定されていない。必要な secrets:"
              echo
              echo '- `CLOUDFLARE_API_TOKEN`（Pages の編集権限）'
              echo '- `CLOUDFLARE_ACCOUNT_ID`'
              echo '- `CLOUDFLARE_PAGES_PROJECT`（Pages のプロジェクト名）'
              echo
              echo "第2層を出す場合は、あわせて Cloudflare Access のポリシーを"
              echo '`configs/publish.yaml` の `deploy.tier2_path` に掛けること。'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.ready == 'true'
        with:
          python-version: "3.11"
          cache: pip

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.ready == 'true'
        with:
          node-version: "20"

      - name: 依存関係のインストール
        if: steps.gate.outputs.ready == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[console,dev]"
          npm --prefix site install

      # **P8 を通さずにデプロイしない。** 第1層に個社特定情報が混ざっていないか、
      # ページに断定的な語彙や順位付けが無いかを、ここで機械的に弾いている。
      # 通らなければ exit code で止まり、デプロイに進まない。
      - name: 公開データの生成と規約検査
        if: steps.gate.outputs.ready == 'true'
        run: mailauth p8-publish --any-month

      - name: サイトのビルド
        if: steps.gate.outputs.ready == 'true'
        run: npm --prefix site run build

      # **値はここに書かない。** リポジトリは公開されているので、
      # 書いた時点で認証をかけた意味が無くなる。GitHub secrets から
      # Pages の環境変数へ流し込む
      - name: Basic 認証の資格情報を Pages に入れる
        if: steps.gate.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ secrets.CLOUDFLARE_PAGES_PROJECT }}
          BASIC_USER: ${{ secrets.BASIC_AUTH_USER }}
          BASIC_PASS: ${{ secrets.BASIC_AUTH_PASS }}
        run: |
          if [ -z "$BASIC_USER" ] || [ -z "$BASIC_PASS" ]; then
            # **止めない。** 止めると認証の無い旧版が出たまま残る。
            # 環境変数が無ければ middleware が全部 401 にするので、
            # 出す側は進めてよい
            echo "::warning::BASIC_AUTH_USER / BASIC_AUTH_PASS が未設定。サイトは全員に 401 を返す"
            exit 0
          fi
          printf '%s' "$BASIC_USER" | npx --yes wrangler@3 pages secret put \
            BASIC_AUTH_USER --project-name "$PROJECT"
          printf '%s' "$BASIC_PASS" | npx --yes wrangler@3 pages secret put \
            BASIC_AUTH_PASS --project-name "$PROJECT"

      # **個社別明細を、サイトの Basic 認証の内側に置く**（運営者の判断、
      # 2026-11-06。configs/publish.yaml の private_drilldown）。
      #
      # 月次の成果物から、国内・米国それぞれ最新のものを取ってくる。リポジトリ
      # には入れない（公開リポジトリなので、入れた時点で認証の外に出る）。
      # 設定が false なら置かない。置いたら、下の確認で 401 を確かめる
      - name: 個社別明細を置く（Basic 認証の内側）
        id: drill
        if: steps.gate.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          read -r ENABLED DPATH < <(python - <<'PY'
          import yaml
          c = (yaml.safe_load(open("configs/publish.yaml", encoding="utf-8")) or {})
          d = c.get("private_drilldown") or {}
          print("yes" if d.get("enabled") else "no", d.get("path") or "companies")
          PY
          )
          if [ "$ENABLED" != "yes" ]; then
            echo "placed=no" >> "$GITHUB_OUTPUT"
            echo "個社別明細は置かない（private_drilldown.enabled が false）" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python - "$DPATH" <<'PY'
          import datetime as dt, json, os, subprocess, sys, tempfile, pathlib, html

          dpath = sys.argv[1]
          repo = os.environ["GITHUB_REPOSITORY"]

          def api(path):
              out = subprocess.run(["gh", "api", path], check=True, capture_output=True, text=True)
              return json.loads(out.stdout)

          today = dt.date.today().replace(day=1)
          months = [today.strftime("%Y-%m"), (today - dt.timedelta(days=1)).strftime("%Y-%m")]
          placed = []
          for pop, short in (("jp-all-listed", "jp"), ("us-all-listed", "us")):
              best = None
              for month in months:
                  for name in (f"tier2-drilldown-{pop}-{month}", f"tier2-drilldown-{month}"):
                      arts = api(f"repos/{repo}/actions/artifacts?name={name}&per_page=50")
                      for a in arts.get("artifacts", []):
                          if a.get("expired"):
                              continue
                          run_id = a["workflow_run"]["id"]
                          if name.endswith(f"-{month}") and pop not in name:
                              # 古い名前は母集団を持たない。実行の題名で見分ける
                              title = api(f"repos/{repo}/actions/runs/{run_id}").get("display_title", "")
                              if pop not in title:
                                  continue
                          if best is None or a["created_at"] > best[0]:
                              best = (a["created_at"], run_id, a["name"], month)
                  if best:
                      break
              if not best:
                  print(f"{pop}: 個社別明細の成果物が無い")
                  continue
              tmp = tempfile.mkdtemp()
              subprocess.run(["gh", "run", "download", str(best[1]), "--repo", repo,
                              "-n", best[2], "-D", tmp], check=True)
              src = pathlib.Path(tmp) / "tier2-drilldown.html"
              dest = pathlib.Path("site/dist") / dpath / short / "index.html"
              dest.parent.mkdir(parents=True, exist_ok=True)
              dest.write_bytes(src.read_bytes())
              placed.append((short, pop, best[3], best[1]))
              print(f"{pop}: {best[2]}（run {best[1]}）を /{dpath}/{short}/ に置いた")

          items = "".join(
              f'<li><a href="./{s}/">{html.escape(p)}（{m}）</a></li>' for s, p, m, _ in placed
          ) or "<li>この時点で置ける明細が無い</li>"
          index = pathlib.Path("site/dist") / dpath / "index.html"
          index.parent.mkdir(parents=True, exist_ok=True)
          index.write_text(
              '<!doctype html><html lang="ja"><head><meta charset="utf-8">'
              '<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">'
              '<meta name="viewport" content="width=device-width, initial-scale=1">'
              "<title>個社別明細</title></head><body style=\"font-family:sans-serif;max-width:40rem;margin:2rem auto;padding:0 1rem\">"
              "<h1>個社別明細</h1><p>DNS など誰でも引ける公開情報から作った計測結果です。"
              "観測できなかったことは「対策していない」ではありません。各表の注記を読んでください。</p>"
              f"<ul>{items}</ul><p><a href=\"../\">サイトに戻る</a></p></body></html>",
              encoding="utf-8",
          )
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              for s, p, m, r in placed:
                  f.write(f"- 個社別明細 {p} {m}（run {r}）→ /{dpath}/{s}/\n")
          PY
          echo "placed=yes" >> "$GITHUB_OUTPUT"
          echo "path=$DPATH" >> "$GITHUB_OUTPUT"

      - name: Cloudflare Pages にデプロイ
        id: deploy
        if: steps.gate.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy site/dist
            --project-name=${{ secrets.CLOUDFLARE_PAGES_PROJECT }}
            --branch=main

      # **かけたつもりで素通しになっていないか、出した後に確かめる。**
      # `functions/` が拾われなければ認証は効かないが、デプロイは成功する。
      # 宣言だけでは守られないので、実際に叩いて確認する
      - name: Basic 認証が効いていることを確かめる
        if: steps.gate.outputs.ready == 'true'
        env:
          URL: ${{ steps.deploy.outputs.deployment-url }}
          BASIC_USER: ${{ secrets.BASIC_AUTH_USER }}
          BASIC_PASS: ${{ secrets.BASIC_AUTH_PASS }}
        run: |
          if [ -z "$URL" ]; then
            echo "::error::デプロイ先の URL が取れないため確認できない"
            exit 1
          fi

          # **出し終えた直後はまだ配られていない。**
          #
          # wrangler が返した時点では、この配備ごとの URL
          # （`https://<hash>.<project>.pages.dev`）はまだ名前が生きて
          # おらず、Cloudflare は 404 を返す。**middleware が無いときの
          # 404 ではない** ── 認証が外れていれば index.html の 200 が
          # 返るので、404 は「まだ配られていない」の側である。
          #
          # 1秒後に叩いて 404 を「認証が効いていない」と読み、
          # #82 と #83 のデプロイが2回とも赤くなった。**出したもの自体は
          # 正しく出ていた。**
          #
          # 名前が生きるまで待ってから判定する。待っても生きなければ、
          # そのときは落とす ── 「確かめられなかった」を「通った」に
          # しない
          code=""
          for _ in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$URL/" || echo 000)
            case "$code" in
              404|000) sleep 6 ;;
              *) break ;;
            esac
          done
          if [ "$code" = "404" ] || [ "$code" = "000" ]; then
            echo "::error::$URL が 2 分たっても応答しない（最後の応答: $code）。確かめられなかった"
            exit 1
          fi
          if [ "$code" != "401" ]; then
            echo "::error::認証なしで $code が返った。Basic 認証が効いていない"
            exit 1
          fi
          echo "認証なし: 401 ✓"

          if [ -n "$BASIC_USER" ] && [ -n "$BASIC_PASS" ]; then
            # **通るはずのものが通ることも確かめる。** 401 だけ見ていると、
            # 誰も入れない状態を「成功」と読んでしまう
            #
            # 認証なしの 401 は関数（functions/）が返すので、静的な中身が
            # まだ配られていなくても先に返る。資格情報つきでは中身まで
            # 届くので、配り終わるまで 404 が返る（run 65 はこれで赤く
            # なった）。こちらも 404/000 は待つ
            ok=""
            for _ in $(seq 1 20); do
              ok=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 \
                -u "$BASIC_USER:$BASIC_PASS" "$URL/" || echo 000)
              case "$ok" in
                404|000) sleep 6 ;;
                *) break ;;
              esac
            done
            if [ "$ok" != "200" ]; then
              echo "::error::正しい資格情報で $ok が返った。誰も入れない"
              exit 1
            fi
            echo "正しい資格情報: 200 ✓"
          fi

          # **個社別明細を置いたなら、そこも認証の内側か確かめる。**
          # 認証なしで 401 以外が返ったら落とす（個社名が認証の外に出ている）
          if [ "${{ steps.drill.outputs.placed }}" = "yes" ]; then
            P="${{ steps.drill.outputs.path }}"
            for sub in "" "jp/" "us/"; do
              c=""
              for _ in $(seq 1 20); do
                c=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$URL/$P/$sub" || echo 000)
                case "$c" in
                  404|000) sleep 6 ;;
                  *) break ;;
                esac
              done
              if [ "$c" != "401" ] && [ "$c" != "404" ]; then
                echo "::error::/$P/$sub が認証なしで $c を返した。個社別明細が認証の外に出ている"
                exit 1
              fi
              echo "/$P/$sub 認証なし: $c ✓"
            done
          fi
