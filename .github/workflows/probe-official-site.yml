name: 公式サイトの推測を試す

# BACKLOG 25。P1 の公式サイトの推測（co_jp_guess）だけを、前の実行で
# **起点が取れなかった会社**に流して、何社埋まるかと、何を採ったかを見る。
# 月次計測を流し直すと2時間半かかり、CT の補充も止まる。推測を変えたときに
# 先に効き目と誤りを確かめるためのもの。
#
# 読むのは月次計測と同じ：DNS（公開リゾルバ）と各社の公式サイトのトップ
# ページを、連絡先つきの User-Agent で、全体で1秒に2本まで。手で起こす
# ときだけ動く。社名とドメインは成果物に置き（7日）、ログには件数だけ出す。

on:
  workflow_dispatch:
    inputs:
      month:
        description: 起点の無い会社を取る月（その月の silver を使う）
        required: false
        default: "2026-11"
      pop:
        description: 母集団
        required: false
        default: jp-all-listed

permissions:
  contents: read
  actions: read

defaults:
  run:
    shell: bash

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MAILAUTH_CONTACT_EMAIL: ${{ secrets.MAILAUTH_CONTACT_EMAIL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 入れる
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: その月の silver を取ってくる
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: silver-${{ inputs.pop }}-${{ inputs.month }}
        run: |
          RUNS=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$NAME&per_page=20" \
                  --jq '[.artifacts[] | select(.expired | not) | .workflow_run.id] | .[]')
          for RUN in $RUNS; do
            TMP=$(mktemp -d)
            gh run download "$RUN" --repo "$GITHUB_REPOSITORY" -n "$NAME" -D "$TMP" || continue
            P7="$TMP/p7_aggregate/_manifest.json"
            if [ -f "$P7" ] && [ "$(jq -r '.status' "$P7")" != "failed" ]; then
              mkdir -p silver && cp -a "$TMP/." silver/
              echo "$NAME を run $RUN から取った" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          done
          echo "$NAME の使える silver が無い" >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: 推測する
        run: |
          if [ -z "$MAILAUTH_CONTACT_EMAIL" ]; then
            echo "MAILAUTH_CONTACT_EMAIL が無い（連絡先を名乗らずに他社のサイトを読まない）" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          mkdir -p out
          python - <<'PY'
          import json, time
          import pandas as pd
          from mailauth.p1_population.runner import (
              CO_JP_CONCURRENCY, _live_co_jp_guesser, in_input_order,
          )
          from mailauth.config import credential, load_population
          from mailauth.p1_population.edinet import fetch_code_list, parse_code_list

          # 読み（カナ）は P1 と同じく EDINET のコードリストから（鍵は要らない）
          kana = {}
          cfg = load_population("configs/populations/${{ inputs.pop }}.yaml")
          if cfg.source.edinet_code_list is not None:
              fetched = fetch_code_list(cfg.source.edinet_code_list)
              listed, _ = parse_code_list(fetched.path, cfg.source.edinet_code_list)
              kana = {r.edinet_code: r.name_kana for r in listed if r.name_kana}

          df = pd.read_parquet("silver/p1_population/entities.parquet")
          missing = df[df["official_domain"].isna()]
          rows = [
              (r["name"], None if pd.isna(r["name_en"]) else r["name_en"],
               kana.get(r["edinet_code"]) if isinstance(r["edinet_code"], str) else None)
              for _, r in missing.iterrows()
          ]
          guesser = _live_co_jp_guesser(credential("MAILAUTH_CONTACT_EMAIL"))
          t0 = time.monotonic()
          got = list(in_input_order(lambda r: guesser.domain_for(*r),
                                    rows, concurrency=CO_JP_CONCURRENCY, window=64))
          stats = guesser.stats.to_dict()
          stats["elapsed_sec"] = round(time.monotonic() - t0)
          stats["kana_available"] = len(kana)
          found = [{"name": n, "name_en": e, "domain": d}
                   for (n, e, _), d in zip(rows, got) if d]
          json.dump({"stats": stats, "found": found}, open("out/probe.json", "w"),
                    ensure_ascii=False, indent=1)
          counts = {k: v for k, v in stats.items() if not k.startswith("sample_")}
          with open(__import__("os").environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write("```\n" + json.dumps(counts, ensure_ascii=False, indent=1) + "\n```\n")
          print(json.dumps(counts, ensure_ascii=False))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-official-site-${{ inputs.pop }}-${{ inputs.month }}
          path: out/
          retention-days: 7
