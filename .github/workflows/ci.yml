name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  # 60日無活動での自動停止対策（DESIGN.md Sprint 8）の一部。
  # 月次で必ず1回は Actions が動くようにしておく。
  schedule:
    - cron: "0 3 1 * *"

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 依存関係のインストール
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[console,dev]"

      - name: Lint
        run: ruff check src console tests

      - name: テスト
        # テストは一切ネットワークに出ない。認証情報が無くても通ること自体が要件。
        run: pytest -q

      - name: CLI が起動することの確認
        run: |
          mailauth --version
          mailauth populations

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: console/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 依存関係のインストール
        run: npm install

      - name: 型検査とビルド
        run: npm run build

  site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 依存関係のインストール
        run: |
          python -m pip install --upgrade pip
          pip install -e "..[console,dev]"
          npm install

      # サイトのデータは gold から P8 が書き出す。生成物はコミットしない。
      # **P8 を通さずにビルドさせない。** 第1層に個社特定情報が混ざっていないか、
      # ページに断定的な語彙や順位付けが無いかを、ここで機械的に弾いている。
      - name: 公開データの生成と規約検査
        working-directory: .
        run: mailauth p8-publish --any-month

      - name: ビルド
        run: npm run build
