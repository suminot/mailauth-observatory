name: 日本語版ウィキペディアの会社の基礎情報から公式サイトが取れるか調べる

# BACKLOG 28。国内 2026-11 で起点（公式サイト）が無い 356 社は、推測
# （co_jp_guess）ではもう増えない。EDINET の鍵が来るまでの別の経路として、
# 日本語版ウィキペディアの記事の「基礎情報 会社」の「外部リンク」を試す。
#
# **同じ会社の記事であることは、記事の基礎情報に書かれた証券コードで
# 確かめる。** 名前だけで当てない（同名の別会社・別の意味の記事がある）。
# 記事の名前は、社名から「株式会社」などを落としたものと、その後ろに
# 「 (企業)」を付けたもの。リダイレクトはたどる。
#
# 2026-11-03 の1回目（run 41650240337）は 356 社中 69 社。本番に入れた
# あとは本番の読み方（jawiki.py。コードは市場情報の欄だけで見る）で流す。
#
# 読むのは MediaWiki の API（action=query、1回に 50 記事まで）だけ。
# 連絡先つきの User-Agent、1秒に1本まで。手で起こすときだけ動く。社名と
# ドメインは成果物に置き（7日）、ログには件数だけ出す。

on:
  workflow_dispatch:
    inputs:
      month:
        description: 起点の無い会社を取る月（その月の silver を使う）
        required: false
        default: "2026-11"

permissions:
  contents: read
  actions: read

defaults:
  run:
    shell: bash

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MAILAUTH_CONTACT_EMAIL: ${{ secrets.MAILAUTH_CONTACT_EMAIL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 入れる
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: その月の silver を取ってくる
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: silver-jp-all-listed-${{ inputs.month }}
        run: |
          RUNS=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$NAME&per_page=20" \
                  --jq '[.artifacts[] | select(.expired | not) | .workflow_run.id] | .[]')
          for RUN in $RUNS; do
            TMP=$(mktemp -d)
            gh run download "$RUN" --repo "$GITHUB_REPOSITORY" -n "$NAME" -D "$TMP" || continue
            P7="$TMP/p7_aggregate/_manifest.json"
            if [ -f "$P7" ] && [ "$(jq -r '.status' "$P7")" != "failed" ]; then
              mkdir -p silver && cp -a "$TMP/." silver/
              echo "$NAME を run $RUN から取った" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          done
          echo "$NAME の使える silver が無い" >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: 記事を引いて比べる
        run: |
          if [ -z "$MAILAUTH_CONTACT_EMAIL" ]; then
            echo "MAILAUTH_CONTACT_EMAIL が無い（連絡先を名乗らずに引かない）" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          mkdir -p out
          python - <<'PY'
          # **本番と同じ読み方**（jawiki.py）で、起点の無い会社にだけ流す
          import json, os
          import pandas as pd
          from mailauth.p1_population.jawiki import JawikiWebsites, live_fetch

          df = pd.read_parquet("silver/p1_population/entities.parquet")
          taken = set(df["official_domain"].dropna())
          missing = df[df["official_domain"].isna() & df["securities_code"].notna()]
          reader = JawikiWebsites(live_fetch())
          urls = reader.websites_for(
              ((r["entity_id"], r["name"], r["securities_code"]) for _, r in missing.iterrows()),
              taken,
          )
          names = dict(zip(missing["entity_id"], missing["name"]))
          found = [{"name": names[k], "url": u} for k, u in urls.items()]
          counts = {k: v for k, v in reader.stats.to_dict().items() if k != "sample_found"}
          json.dump({"counts": counts, "found": found}, open("out/probe.json", "w"),
                    ensure_ascii=False, indent=1)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write("```\n" + json.dumps(counts, ensure_ascii=False, indent=1) + "\n```\n")
          print(json.dumps(counts, ensure_ascii=False))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-wikipedia-${{ inputs.month }}
          path: out/
          retention-days: 7
