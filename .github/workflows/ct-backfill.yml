name: CT の補充

# **CT の取得を「月初の1回」に賭けない**（BACKLOG 12、ctlog.py）。
#
# crt.sh は 2026-09 から 2026-11 まで、月次計測のたびに落ちていた。落ち方は
# まだらで、一日のうちに戻る時間帯もある。月次計測の P2 が取れなかった起点
# ドメインを積み残しとして書き、ここで毎時少しずつ取り直す。
#
#   1. crt.sh を qps 0.5 のまま試す（相手への礼儀なので外さない）。5本続けて
#      取れなければ、落ちているとみてやめる
#   2. 残りを CertSpotter で取る。鍵なしは1時間に10本までなので、毎時
#      1回9本まで（応答の残り回数が 0 になったらその場でやめる）
#   3. 積み残しが 2% 以下になり、新しく取れたものがあれば、その月の計測を
#      同じ run_id で流し直す（月に2回まで）
#
# **制限をすり抜けるために IP や経路を変えることはしない。** 取れないなら
# 待って、次の回にまた試す。

on:
  schedule:
    - cron: "41 * * * *"
  workflow_dispatch:
    inputs:
      run_id:
        description: "実行ID（YYYY-MM）。既定は当月"
        required: false
      certspotter_requests:
        description: "CertSpotter に投げる本数の上限（鍵なしは1時間に10本まで）"
        required: false
        default: "9"

concurrency:
  # 補充どうしが同じキャッシュを書き合わないように
  group: ct-backfill
  cancel-in-progress: false

permissions:
  contents: read
  # 積み残しが片付いたら月次計測の流し直しを頼む（gh workflow run）
  actions: write

defaults:
  run:
    shell: bash

jobs:
  backfill:
    runs-on: ubuntu-latest
    # 補充 45 分 ＋ 相手が答えなかった回の待ち 20 分（「待ってから続きを頼む」）
    timeout-minutes: 80
    env:
      # 無くても動く（鍵なしの無料枠）。あれば上限が上がる
      MAILAUTH_CERTSPOTTER_API_KEY: ${{ secrets.MAILAUTH_CERTSPOTTER_API_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: run_id を決める
        id: run
        run: |
          RUN_ID="${{ github.event.inputs.run_id }}"
          if [ -z "$RUN_ID" ]; then RUN_ID=$(date -u +%Y-%m); fi
          echo "id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "run_id=$RUN_ID"

      # **月次計測が走っている間は触らない。** 向こうも同じ月の CT キャッシュを
      # 読み書きしていて、後から保存した方が先の分を上書きする
      - name: 月次計測が走っていないか確かめる
        id: busy
        # 月次計測は終わり際にこの補充を頼む。頼んだ時点では向こうがまだ
        # 「実行中」なので、**10分までは終わるのを待つ**
        run: |
          for i in $(seq 1 20); do
            n=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow monthly.yml \
                  --json status --jq '[.[] | select(.status != "completed")] | length')
            [ "$n" = "0" ] && break
            sleep 30
          done
          echo "monthly_running=$n" >> "$GITHUB_OUTPUT"
          # **月次計測の最中でも、P2（CT のキャッシュを書く工程）にいなければ、
          # 組織名の積み残しだけを引く**（2026-11-07）。計測を続けて回すと、
          # 止まっている間だけでは組織名の逆引きのキャッシュが埋まらない。
          # ドメインの積み残しと流し直しには触らない
          in_p2=0
          if [ "$n" != "0" ]; then
            for id in $(gh run list --repo "$GITHUB_REPOSITORY" --workflow monthly.yml \
                          --json databaseId,status --jq '.[] | select(.status == "in_progress") | .databaseId'); do
              step=$(gh run view "$id" --repo "$GITHUB_REPOSITORY" --json jobs \
                       --jq '[.jobs[].steps[] | select(.status == "in_progress") | .name] | join(",")')
              case "$step" in *P2*|*CT*) in_p2=1 ;; esac
            done
          fi
          if [ "$n" = "0" ]; then mode=full
          elif [ "$in_p2" = "0" ]; then mode=org
          else mode=skip
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          if [ "$mode" = "skip" ]; then
            echo "月次計測が P2 にいる。今回は補充しない" >> "$GITHUB_STEP_SUMMARY"
          elif [ "$mode" = "org" ]; then
            echo "月次計測が $n 本走っている。組織名の積み残しだけを引く" >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/setup-python@v5
        if: steps.busy.outputs.mode != 'skip'
        with:
          python-version: "3.11"
          cache: pip

      - name: 依存関係のインストール
        if: steps.busy.outputs.mode != 'skip'
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: CT ログのキャッシュを復元
        if: steps.busy.outputs.mode != 'skip'
        id: ct_cache
        uses: actions/cache/restore@v4
        with:
          path: data/cache/crtsh
          key: crtsh-${{ steps.run.outputs.id }}-${{ github.run_id }}
          restore-keys: |
            crtsh-${{ steps.run.outputs.id }}-

      # **組織名だけの回は 15 分で切り上げる。** 次の月次計測の P2 は、crt.sh を
      # 倍の頻度で叩かないよう、この工程が終わるのを待つ。長く走ると計測が止まる
      - name: 補充
        if: steps.busy.outputs.mode != 'skip'
        id: fill
        run: |
          ORG_ONLY=""
          MINUTES=45
          if [ "${{ steps.busy.outputs.mode }}" = "org" ]; then ORG_ONLY="--org-only"; MINUTES=15; fi
          mailauth ct-backfill --run "${{ steps.run.outputs.id }}" $ORG_ONLY \
            --max-minutes "$MINUTES" \
            --certspotter-requests "${{ github.event.inputs.certspotter_requests || '9' }}" \
            > /tmp/backfill.json
          cat /tmp/backfill.json
          # **組織名検索で取れた分も数える。** 数えないと、組織名だけ取れた回で
          # キャッシュを保存しない（下の「保存」は got が 0 だと動かない）
          got=$(jq '[.crtsh.got // 0, .certspotter.got // 0, .crtsh_org.got // 0] | add' /tmp/backfill.json)
          echo "got=$got" >> "$GITHUB_OUTPUT"
          echo "ready=$(jq -r '.ready_for_rerun | join(" ")' /tmp/backfill.json)" >> "$GITHUB_OUTPUT"
          echo "pending=$(jq '([.populations[].pending_after // 0] | add // 0) + (.crtsh_org.pending_after // 0)' /tmp/backfill.json)" >> "$GITHUB_OUTPUT"
          # crt.sh から実際に取れて、落ちているとも判定されなかったか（組織名検索も含む）
          echo "crtsh_ok=$(jq -r '(((.crtsh.got // 0) + (.crtsh_org.got // 0)) > 0) and (.crtsh.upstream_down == null)' /tmp/backfill.json)" >> "$GITHUB_OUTPUT"
          {
            echo "### CT の補充 ${{ steps.run.outputs.id }}"
            echo
            echo "新しく取れた起点ドメイン: $got"
            echo
            echo '```json'
            cat /tmp/backfill.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # 流し直しを頼んだことを**キャッシュを保存する前に**書く。保存の後に
      # 書くと、次の回がそれを知らずにまた頼む
      - name: 流し直しを頼んだと記録する
        if: steps.fill.outputs.ready != ''
        run: |
          for pop in ${{ steps.fill.outputs.ready }}; do
            mailauth ct-backfill --run "${{ steps.run.outputs.id }}" --mark-rerun "$pop"
          done

      # **保存の前に、その間に別の実行が保存した分を混ぜる。** 鍵は
      # crtsh-<月>-<run_id> で、復元は一番新しいものを取る。補充と月次計測が
      # 重なると、後から保存した方が先の方の結果（別の母集団の積み残しを
      # 含む）を消す。ファイルはドメインごとなので和集合で混ぜ、**同じ
      # ファイルはこの実行の方を残す**
      - name: CT キャッシュを退避する
        if: steps.fill.outputs.got != '' && steps.fill.outputs.got != '0'
        run: |
          rm -rf /tmp/crtsh-ours
          if [ -d data/cache/crtsh ]; then mv data/cache/crtsh /tmp/crtsh-ours; fi

      - name: その間に保存された CT キャッシュを復元する
        if: steps.fill.outputs.got != '' && steps.fill.outputs.got != '0'
        uses: actions/cache/restore@v4
        with:
          path: data/cache/crtsh
          key: crtsh-${{ steps.run.outputs.id }}-latest-${{ github.run_id }}
          restore-keys: |
            crtsh-${{ steps.run.outputs.id }}-

      - name: この実行の CT キャッシュを上から重ねる
        if: steps.fill.outputs.got != '' && steps.fill.outputs.got != '0'
        run: |
          mkdir -p data/cache/crtsh
          if [ -d /tmp/crtsh-ours ]; then cp -a /tmp/crtsh-ours/. data/cache/crtsh/; fi

      - name: CT ログのキャッシュを保存
        if: steps.fill.outputs.got != '' && steps.fill.outputs.got != '0'
        uses: actions/cache/save@v4
        with:
          path: data/cache/crtsh
          key: crtsh-${{ steps.run.outputs.id }}-${{ github.run_id }}

      # **公開の判断は月次計測のゲートに任せる。** P4 が測り終えなかった月、
      # 前の月より分母が小さい月は、流し直しても gold をコミットしない
      - name: 月次計測を流し直す
        if: steps.fill.outputs.ready != ''
        run: |
          for pop in ${{ steps.fill.outputs.ready }}; do
            config="configs/populations/${pop}.yaml"
            if [ ! -f "$config" ]; then
              echo "::warning::$config が無いので流し直さない"
              continue
            fi
            gh workflow run monthly.yml --repo "$GITHUB_REPOSITORY" --ref main \
              -f run_id="${{ steps.run.outputs.id }}" \
              -f population="$config" \
              -f publish=yes \
              -f start_from=p1
            echo "$pop を流し直した" >> "$GITHUB_STEP_SUMMARY"
          done

      # **定期実行だけに頼らない。** 毎時の schedule は、足してから3時間
      # 一度も起動しなかった（2026-11-01、GitHub の schedule は遅れたり
      # 落ちたりする）。1回 45 分で取れるのは 140 件前後で、国内の積み残し
      # 3,195 件には 20 回以上かかる。
      #
      # **crt.sh から取れた回だけ、次の回を自分で頼む。** 相手が落ちて
      # いると判定した回は、CertSpotter で取れていても頼まない ──
      # 2026-11-01、その条件が無く、crt.sh が弱っている間に5分おきに
      # 32本ずつ投げ続けた（手で止めた）。止まったら、次の schedule か
      # 月次計測の終わりから再開する。qps は変えない。
      # 同じ concurrency グループなので、この回が終わってから始まる
      - name: 続きを頼む
        if: >-
          steps.fill.outputs.crtsh_ok == 'true'
          && steps.fill.outputs.ready == ''
          && steps.fill.outputs.pending != '0'
        run: |
          gh workflow run ct-backfill.yml --repo "$GITHUB_REPOSITORY" --ref main \
            -f run_id="${{ steps.run.outputs.id }}"
          echo "積み残し ${{ steps.fill.outputs.pending }} 件。続きを頼んだ" >> "$GITHUB_STEP_SUMMARY"

      # **取れなかった回も、待ってから次を頼む。** 毎時の schedule は 30 時間で
      # 4回しか起動しておらず（2026-11-02〜03）、それに任せると補充が半日
      # 止まる。落ちている相手を叩き続けないよう、**20 分待ってから** 1回だけ
      # 頼む。次の回も crt.sh は数本で見切るので、相手から見て 20 分に数本
      # （qps は変えない）
      - name: 取れなかった回は待ってから続きを頼む
        if: >-
          steps.busy.outputs.monthly_running == '0'
          && steps.fill.outputs.crtsh_ok != 'true'
          && steps.fill.outputs.ready == ''
          && steps.fill.outputs.pending != '0'
          && steps.fill.outputs.pending != ''
        run: |
          sleep 1200
          gh workflow run ct-backfill.yml --repo "$GITHUB_REPOSITORY" --ref main \
            -f run_id="${{ steps.run.outputs.id }}"
          echo "crt.sh から取れなかった。20 分待って続きを頼んだ（積み残し ${{ steps.fill.outputs.pending }} 件）" >> "$GITHUB_STEP_SUMMARY"
