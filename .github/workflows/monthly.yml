name: 月次計測

# 人手を介さず月次で八工程を回す（DESIGN.md Sprint 8）。
#
# 60日自動停止対策が要件になっている。GitHub Actions は60日間リポジトリに
# 活動が無いと schedule が止まる。**データが変わらなかった月でも必ず
# コミットする**ことで、活動を途切れさせない。
#
# 実行は工程ごとに分けてある。どこで落ちたかを job 単位で見たいのと、
# 6時間上限に当たったときに続きから流せるようにするため。

on:
  schedule:
    # 毎月1日 02:00 UTC。月初にしているのは measured_month を月単位で
    # 扱っているため（run_id は YYYY-MM）
    - cron: "0 2 1 * *"
  workflow_dispatch:
    inputs:
      run_id:
        description: "実行ID（YYYY-MM）。既定は当月"
        required: false
      population:
        description: "母集団"
        required: false
        default: configs/populations/jp-all-listed.yaml
        # パスを手で打たせない。**初回はここで us-all-listed を選べば
        # 鍵は MAILAUTH_CONTACT_EMAIL ひとつで通る**（SEC EDGAR は
        # パブリックドメイン、Wikidata は CC0 で、登録も申請も要らない）。
        type: choice
        options:
          - configs/populations/jp-all-listed.yaml
          - configs/populations/us-all-listed.yaml
          - configs/populations/jp-prime.yaml
          - configs/populations/jp-standard.yaml
          - configs/populations/jp-growth.yaml
          - configs/populations/jp-nikkei225.yaml
          - configs/populations/us-fortune500.yaml
          - configs/populations/global500.yaml
      limit:
        description: "件数上限。初回の動作確認は 50"
        required: false
      publish:
        # **数字を見てから公開を決められるようにする。**
        #
        # 以前は「limit を入れると gold をコミットしない」しか無く、全件を
        # 公開せずに回すには limit に大きい値を入れて副作用を使うことに
        # なっていた。2026-09-25 に実際にそうしたが、**その経路には数字を
        # 見る手段が無かった** ── gold はランナーごと消え、何が出たのか
        # 分からないまま終わった。意図を名前で言えるようにする。
        description: "gold をコミットして公開するか"
        required: false
        default: "yes"
        type: choice
        options:
          - "yes"
          - "no"
      start_from:
        # **時間切れの続きを、続きから流す。**
        #
        # 2026-10 の米国計測（run 40150006097）は P4 の途中でジョブの
        # 上限（5時間半）に当たった。工程の出力はキャッシュに残っていて
        # P4 は --resume で続きから測れるのに、**流し直すと P1〜P3 を
        # 毎回やり直し、それだけで3時間15分を使う。** P4 に残るのは
        # 2時間ほどで、また同じ所で切れる。
        #
        # p4 を選ぶと、復元した P1〜P3 の出力をそのまま使う。**同じ
        # run_id の流し直しのときだけ使うこと**（別の月の出力は復元され
        # ないので、下の確認で止まる）。
        description: "どの工程から流すか。時間切れの続きなら p4"
        required: false
        default: p1
        type: choice
        options:
          - p1
          - p4

concurrency:
  # 同じ run に対して2つ走ると manifest の書き込みが競合し、
  # 原則6（冪等）が壊れる
  group: monthly-${{ github.event.inputs.run_id || 'scheduled' }}
  cancel-in-progress: false

permissions:
  contents: write
  # 終わったあとに CT の補充を頼む（最後のステップ）
  actions: write

# **`shell: bash` を明示する。** 明示しないと Actions は `bash -e {0}` で
# 走らせ、`pipefail` が付かない ── `cmd | tee` の cmd が失敗しても
# ステップは成功になる。2026-10-18、crt.sh の DB 直結の試験が、接続を
# 断られたのに success で終わった
defaults:
  run:
    shell: bash

jobs:
  measure:
    runs-on: ubuntu-latest
    # P4 は30,000ドメインで3時間を見込む。6時間上限に対する余裕を取る
    timeout-minutes: 330
    env:
      MAILAUTH_EDINET_SUBSCRIPTION_KEY: ${{ secrets.MAILAUTH_EDINET_SUBSCRIPTION_KEY }}
      MAILAUTH_GBIZINFO_TOKEN: ${{ secrets.MAILAUTH_GBIZINFO_TOKEN }}
      MAILAUTH_HOUJIN_BANGOU_APP_ID: ${{ secrets.MAILAUTH_HOUJIN_BANGOU_APP_ID }}
      MAILAUTH_CONTACT_EMAIL: ${{ secrets.MAILAUTH_CONTACT_EMAIL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 依存関係のインストール
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[console,dev]"

      - name: run_id を決める
        id: run
        run: |
          RUN_ID="${{ github.event.inputs.run_id }}"
          if [ -z "$RUN_ID" ]; then RUN_ID=$(date -u +%Y-%m); fi
          echo "id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "run_id=$RUN_ID"
          # 工程の出力のキャッシュを母集団で分ける（下の「工程の出力を復元」）
          POP=$(basename "${{ github.event.inputs.population || 'configs/populations/jp-all-listed.yaml' }}" .yaml)
          echo "pop=$POP" >> "$GITHUB_OUTPUT"
          # P4 の持ち時間をここから数える（下の「P4 DNS計測」）
          echo "JOB_STARTED=$(date +%s)" >> "$GITHUB_ENV"

      # 何が足りていて何が足りないかを実行ログの先頭に出す。**鍵の不足は
      # P1 が落ちてから気付くのでは遅い**（工程ごとに continue-on-error に
      # しているので、鍵が無い実行は「全部そこそこ動いて中身が空」になる）。
      # 診断は読むだけなので失敗させない。
      - name: 準備状況の診断
        continue-on-error: true
        run: |
          mailauth doctor | tee /tmp/doctor.txt
          {
            echo "## 準備状況"
            echo '```'
            cat /tmp/doctor.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # CT ログのキャッシュを実行間で持ち越す。**P2 の所要時間を決めているのは
      # ここである。** crt.sh は qps 0.5 に絞っており（相手への礼儀なので
      # 外さない）、1件あたり最悪3分（timeout 60秒 × retries 2 ＋ バックオフ）
      # かかる。3,800社を1回の実行で取りきるのは現実的でない。
      #
      # **キャッシュは月で区切る**（ctlog.py が `month=YYYY-MM/` に分ける）。
      # CT ログは追記されるので、月をまたいで使い回すと時系列が凍る。
      # 同じ月に複数回流せば、2回目以降は取得済みのぶんを飛ばせる。
      - name: CT ログのキャッシュを復元
        id: ct_cache
        uses: actions/cache/restore@v4
        with:
          path: data/cache/crtsh
          key: crtsh-${{ steps.run.outputs.id }}-${{ github.run_id }}
          restore-keys: |
            crtsh-${{ steps.run.outputs.id }}-

      # 各工程は失敗しても続ける。**途中で止めると manifest が揃わず、
      # どこで何件落ちたかが分からなくなる**（原則4）。
      # 最終的な成否は manifest を集めて判断する。
      # 補完（enrich）のキャッシュを実行間で持ち越す。**P1 の所要時間を
      # 決めているのはここである。** 2026-09 の国内計測で P1 は12分47秒
      # かかったが、その大半は gBizINFO を 5 qps で 3,818社ぶん引く時間で、
      # 母集団そのものの取得（EDINET の zip）は一瞬で終わっている。
      #
      # **キャッシュは月で区切る。** 企業の公式サイトは変わりうるので、
      # 月をまたいで使い回すと古い URL で固定され、しかも数字は動かないので
      # 気付けない（CT ログと同じ理屈）。**月を跨ぐ復元はしない** ──
      # restore-keys を当月の前方一致だけにしてある。
      #
      # 効くのは同じ月の流し直しで、まさに今それを繰り返している。
      - name: 補完のキャッシュを復元
        id: enrich_cache
        uses: actions/cache/restore@v4
        with:
          # **crtsh は入れない。** 別の鍵で別に持ち越しており、ここに
          # `data/cache` をまとめて書くと、復元の順番によっては
          # 新しい CT のキャッシュに古いものを被せてしまう
          path: |
            data/cache/gbizinfo
            data/cache/houjin_bangou
            data/cache/sec_edgar
            data/cache/edinet
          key: enrich-${{ steps.run.outputs.id }}-${{ github.run_id }}
          restore-keys: |
            enrich-${{ steps.run.outputs.id }}-

      # 工程の出力そのものを実行間で持ち越す。**ここまで無かった。**
      # 2026-09 の実行は P4 で時間切れになり、P1（12分）・P2（4時間21分）・
      # P3（23分）の出力と、245ドメインぶんの bronze が**すべて消えた。**
      # 残ったのは CT ログのキャッシュだけだった。
      #
      # 復元できれば P4 は `--resume` で続きから測れる。**キャッシュは
      # 月で区切る**（run_id が YYYY-MM なので、別の月は別の鍵になる）。
      #
      # **母集団でも分ける。** 月だけで区切っていると、2026-10 に米国を
      # 回したあとで国内を同じ月で回したとき、米国の P1〜P4 の出力が
      # 復元される（P4 は米国の bronze を「測り終えた」と読み、P5 は
      # 米国のドメインまで読む）
      - name: 工程の出力を復元
        id: runs_cache
        uses: actions/cache/restore@v4
        with:
          path: data/runs/${{ steps.run.outputs.id }}
          key: runs-${{ steps.run.outputs.pop }}-${{ steps.run.outputs.id }}-${{ github.run_id }}
          restore-keys: |
            runs-${{ steps.run.outputs.pop }}-${{ steps.run.outputs.id }}-

      # **何を持って始めたのかが、終わるまで分からない。**
      #
      # P2 の所要時間はほぼ「CT を何件取りにいくか」で決まり、それは
      # 復元できたキャッシュの件数で決まる。ところが復元の成否はログに
      # しか出ず、**実行中のログは読めない**（上と同じ 404）。run 10 の
      # 見守りで実際に詰まった ── 復元ステップが0秒で終わっており、
      # **当たったのか外れたのかが判断できなかった。**
      #
      # 件数を数えて成果物に上げる。開始1分以内に出るので、
      # **5時間待たずに「今回どこから始まったか」が分かる。**
      - name: 復元できたものを先に出す
        if: always()
        continue-on-error: true
        run: |
          mkdir -p /tmp/restored
          {
            echo "run_id=${{ steps.run.outputs.id }}"
            echo "ct_matched_key=${{ steps.ct_cache.outputs.cache-matched-key }}"
            echo "ct_entries=$(find data/cache/crtsh -type f 2>/dev/null | wc -l)"
            echo "enrich_matched_key=${{ steps.enrich_cache.outputs.cache-matched-key }}"
            echo "gbizinfo_entries=$(find data/cache/gbizinfo -type f 2>/dev/null | wc -l)"
            echo "runs_matched_key=${{ steps.runs_cache.outputs.cache-matched-key }}"
            # **どの工程の出力が戻ったか。** manifest があれば、その工程は
            # 前回この run で最後まで走っている
            for p in data/runs/${{ steps.run.outputs.id }}/*/_manifest.json; do
              [ -f "$p" ] && echo "restored_phase=$(basename "$(dirname "$p")")"
            done
          } | tee /tmp/restored/restored.txt >> "$GITHUB_STEP_SUMMARY"

      - name: 復元の状況を成果物にする
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: restored-${{ steps.run.outputs.id }}
          path: /tmp/restored/restored.txt
          if-no-files-found: ignore
          retention-days: 7

      # **続きから流すと言ったのに、続きが無い。** 黙って P4 に入ると
      # 「P3 の出力が無い」で落ちるだけで、理由が読み取りにくい。
      # ここで止めて理由を書く。continue-on-error にはしない
      - name: 続きから流せるか確かめる
        if: github.event.inputs.start_from == 'p4'
        run: |
          D="data/runs/${{ steps.run.outputs.id }}"
          missing=""
          for phase in p1_population p2_candidates p3_domains; do
            [ -f "$D/$phase/_manifest.json" ] || missing="$missing $phase"
          done
          if [ -n "$missing" ]; then
            echo "::error::start_from=p4 だが、復元した出力に${missing} が無い。p1 から流すこと"
            exit 1
          fi
          {
            echo "### P1〜P3 は前回の出力を使う（start_from=p4）"
            echo
            echo "復元したキャッシュ: \`${{ steps.runs_cache.outputs.cache-matched-key }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: P1 母集団確定
        if: github.event.inputs.start_from != 'p4'
        continue-on-error: true
        run: |
          mailauth p1-population \
            --config "${{ github.event.inputs.population || 'configs/populations/jp-all-listed.yaml' }}" \
            --run "${{ steps.run.outputs.id }}" \
            ${{ github.event.inputs.limit && format('--limit {0}', github.event.inputs.limit) || '' }}

      # **5時間半の工程の途中経過を、終わるまで読めないのはつらい。**
      #
      # GitHub は実行中のジョブのログを返さない（404）。P1 のステップが
      # 終わっていても、分母がどれだけ埋まったかは**ジョブ全体が終わるまで
      # 分からない。** 2026-09 の見守りで実際に1時間以上待たされた。
      #
      # 成果物は実行中でも一覧・取得できるので、manifest をそのまま上げる。
      # ステップ要約はページを見る人向け ── **こちらは API からは読めない**
      # ので、両方置く。
      - name: P1 の結果を先に出す
        if: always()
        continue-on-error: true
        run: |
          M="data/runs/${{ steps.run.outputs.id }}/p1_population/_manifest.json"
          [ -f "$M" ] || exit 0
          {
            echo "## P1 母集団確定"
            echo
            echo '```json'
            jq '{status, counts, warnings: [.warnings[].code],
                 enrich_seconds: .breakdown.enrich_seconds,
                 wikidata: .breakdown.wikidata_identity,
                 co_jp_homepage: .breakdown.co_jp_homepage}' "$M"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: P1 の manifest を成果物にする
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: manifest-p1-${{ steps.run.outputs.id }}
          path: data/runs/${{ steps.run.outputs.id }}/p1_population/_manifest.json
          if-no-files-found: ignore
          retention-days: 7

      # **P1 の直後に保存する。** 後続の工程で時間切れになっても、
      # 12分かけて集めた補完結果は残る（CT ログと同じ考え方）
      - name: 補完のキャッシュを保存
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            data/cache/gbizinfo
            data/cache/houjin_bangou
            data/cache/sec_edgar
            data/cache/edinet
          key: enrich-${{ steps.run.outputs.id }}-${{ github.run_id }}

      - name: P2 ドメイン候補生成
        if: github.event.inputs.start_from != 'p4'
        continue-on-error: true
        run: mailauth p2-candidates --run "${{ steps.run.outputs.id }}"

      # **P2 の直後に保存する。** 既定の post ステップに任せると、後続の工程で
      # ジョブが時間切れになったときに保存されず、次の実行がまた最初から
      # crt.sh を叩くことになる。**一番高くついた成果を最初に確保する。**
      - name: CT ログのキャッシュを保存
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/cache/crtsh
          key: crtsh-${{ steps.run.outputs.id }}-${{ github.run_id }}

      - name: P3 メールドメイン確定
        if: github.event.inputs.start_from != 'p4'
        continue-on-error: true
        run: mailauth p3-domains --run "${{ steps.run.outputs.id }}"

      # **P4 に入る前に確保する。** ここから先で時間切れになっても、
      # P1〜P3 の出力（合計5時間ぶん）は次の実行に渡る
      - name: 工程の出力を保存（P3 まで）
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/runs/${{ steps.run.outputs.id }}
          key: runs-${{ steps.run.outputs.pop }}-${{ steps.run.outputs.id }}-${{ github.run_id }}-p3

      # **--resume を既定にする。** bronze は不変・追記のみなので、
      # 付けずに流し直すと同じドメインを二重に測る（相手の DNS に無駄な
      # 負荷をかけ、件数の意味も壊れる）。続きが無ければ警告が出るだけで、
      # 最初から測る。
      #
      # **ジョブの上限より先に、自分で止まる。** 外から殺されると P4 の
      # manifest が残らず、時間切れや投げ直しがどれだけあったかが分からない
      # （2026-10 の米国計測で、遅い理由を確かめられなかった）。後ろの工程と
      # 成果物の保存にも時間を残す。止まった分は次の実行が --resume で測る
      - name: P4 DNS計測
        continue-on-error: true
        env:
          # 上の timeout-minutes と同じ値にする（検査で突き合わせている）
          JOB_TIMEOUT_MINUTES: 330
          # P5〜P8・成果物の保存・コミットに残す分
          RESERVE_MINUTES: 40
        run: |
          elapsed=$(( ($(date +%s) - JOB_STARTED) / 60 ))
          budget=$(( JOB_TIMEOUT_MINUTES - RESERVE_MINUTES - elapsed ))
          if [ "$budget" -lt 5 ]; then budget=5; fi
          echo "P4 の持ち時間: ${budget} 分（経過 ${elapsed} 分）"
          mailauth p4-measure --run "${{ steps.run.outputs.id }}" --resume \
            --max-minutes "$budget"

      # **一番高くつく工程の直後に確保する。** P4 は 2,153 ドメインで
      # 35分前後かかる見込みで、途中で殺されてもここまでの bronze は残る。
      # `--resume` がこれを読んで続きから測る
      - name: 工程の出力を保存（P4 まで）
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/runs/${{ steps.run.outputs.id }}
          key: runs-${{ steps.run.outputs.pop }}-${{ steps.run.outputs.id }}-${{ github.run_id }}-p4

      - name: P5 パース
        continue-on-error: true
        run: mailauth p5-parse --run "${{ steps.run.outputs.id }}"

      - name: P6 推察
        continue-on-error: true
        run: mailauth p6-infer --run "${{ steps.run.outputs.id }}"

      - name: P7 集計
        continue-on-error: true
        run: mailauth p7-aggregate --run "${{ steps.run.outputs.id }}"

      # changelog は P8 より先に作る。**site/src/changelog.md を書き換えるので、
      # P8 のページ検査（断定的な語彙・順位付けの禁止）を通す必要がある。**
      - name: 変更履歴の生成
        continue-on-error: true
        run: mailauth changelog

      # 訂正履歴は runs/ に書く。**公開サイトには出さない**（内部運用で
      # 外部からの訂正申告を受け付けていない）。登録簿と審査期限の仕組みは
      # 残してあり、第2層を外部に出す段で公開先を戻す。
      #
      # **--fail-on-overdue は付けない。** 審査が遅れていることを理由に月次の
      # 計測そのものを止めると、無関係な数字の記録まで落ちる。第1層は個社を
      # 名指ししないので実害が小さい。**未処理の申告が第2層を止めるのは
      # P8 の側でやっている**（tier2 は overdue があれば公開しない）。
      - name: 訂正履歴の生成
        continue-on-error: true
        run: mailauth corrections

      - name: P8 公開データの生成
        continue-on-error: true
        run: mailauth p8-publish --run "${{ steps.run.outputs.id }}" --any-month

      # 未知 MX ホストの作業リスト。**一覧が出るだけでは routine にならない。**
      # 月をまたいで「何か月連続で未知のままか」を数えるので、生成物を
      # runs/ に残してコミットする（翌月の連続month数の材料になる）
      - name: 未知 MX ホストの作業リスト
        continue-on-error: true
        # **ファイル名に母集団を入れる。** 同じ月に国内と米国の両方を測るので、
        # 月だけの名前だと後から回した方が先の分を上書きする
        run: |
          mailauth worklist --run "${{ steps.run.outputs.id }}" \
            --out "runs/${{ steps.run.outputs.id }}-${{ steps.run.outputs.pop }}-worklist.md"

      - name: 工程レポート
        id: report
        run: |
          mailauth status --run "${{ steps.run.outputs.id }}"
          mailauth run-report --run "${{ steps.run.outputs.id }}" \
            --out "runs/${{ steps.run.outputs.id }}-${{ steps.run.outputs.pop }}.md"

      # 第2層（個社名付き明細）を、**公開しない形で**出す。
      #
      # `p8-publish` の第2層は事前通知から最低30日とアクセス制御が揃う
      # まで出せない。`site/` と `gold/` には書かない（コード側が拒む）。
      #
      # **成果物は、GitHub にログインしている人なら誰でも取れる**（公開
      # リポジトリのため。GitHub の公式資料、2026-10-25 に確認）。以前ここに
      # 「リポジトリの権限を持つ人しか取れない」と書いていたが、誤りだった。
      #
      # **それを承知で上げる**（運営者の判断、2026-10-25）。明細の中身は
      # DNS など誰でも引ける公開情報（OSINT）から作ったもので、成果物に
      # 置いても新たに秘密が漏れるわけではない。**公開サイトの第2層とは
      # 別の話である** ── 第2層の条件（事前通知から30日・アクセス制御）は
      # 公開サイトに個社名付きで出すときの条件で、こちらは変わらない。
      - name: 個社別明細を作る（社外秘）
        if: always()
        continue-on-error: true
        run: mailauth drilldown --run "${{ steps.run.outputs.id }}"

      - name: 個社別明細を成果物にする
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: tier2-drilldown-${{ steps.run.outputs.id }}
          path: data/runs/${{ steps.run.outputs.id }}/tier2-drilldown.html
          if-no-files-found: warn
          retention-days: 30

      # **公開しない実行でも、数字が読めること。**
      #
      # 2026-09-25 に「全件だが公開しない」形で2回回したが、**どちらも数字が
      # 見られないまま終わった。** gold はコミットされず、ランナーごと消える。
      # 「出す前に数字を見て決める」ためにそうしたのに、見る手段が無かった。
      #
      # 成果物なら実行中でも取れるし、公開とは無関係に残る。サイト用の
      # JSON / CSV も一緒に上げる ── **parquet は手元で開く道具が要る。**
      - name: gold を成果物にする
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: gold-${{ steps.run.outputs.id }}
          path: |
            gold/month=${{ steps.run.outputs.id }}/
            site/src/data/
          if-no-files-found: warn
          retention-days: 30

      # **全工程の記録（manifest）を成果物にする。** 辞書を育てる材料
      # （自社でない rua 宛先、共用ドメインなど）は P2 の記録の中にしかなく、
      # これまでは Actions のキャッシュに閉じ込められて取り出せなかった。
      # 中身は公開情報から作ったもの（上の明細と同じ判断）
      - name: 全工程の記録を成果物にする
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: manifests-${{ steps.run.outputs.id }}
          path: data/runs/${{ steps.run.outputs.id }}/*/_manifest.json
          if-no-files-found: warn
          retention-days: 30

      # bronze / silver は Git に入れない（履歴肥大化の回避）。
      # 認証情報が無ければ理由付きでスキップする。**成功したふりをしない。**
      # 退避されていないことに気付くのがリポジトリを失ったあとでは遅い。
      - name: bronze / silver を R2 に退避
        continue-on-error: true
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          # 副の退避先。**同じ事業者に2つ置いても持続性は上がらない**ので
          # 別事業者・別アカウントを想定している（DESIGN.md 第9章）
          BACKUP_ACCESS_KEY_ID: ${{ secrets.BACKUP_ACCESS_KEY_ID }}
          BACKUP_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_SECRET_ACCESS_KEY }}
          BACKUP_ENDPOINT: ${{ secrets.BACKUP_ENDPOINT }}
          BACKUP_BUCKET: ${{ secrets.BACKUP_BUCKET }}
        run: |
          pip install "boto3>=1.34"
          mailauth offload --run "${{ steps.run.outputs.id }}"

      # **データが変わらなかった月でも必ずコミットする。**
      # GitHub Actions は60日間活動が無いと schedule を止める。
      # 実行した記録そのものが活動になる。
      - name: gold と実行記録をコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # **--limit を掛けた実行の gold はコミットしない。**
          # gold は公開データセットそのもので、P8 がそのままサイトに流す。
          # 50社だけ回した結果を us-all-listed として置くと、「米国上場企業を
          # 計測した数字」として世に出る。件数が受け入れ範囲の外であることは
          # CI が弾くが、そもそも入れない。
          #
          # 実行記録（runs/）は残す。**何を回したかの記録は、結果を出さない
          # 実行でも意味がある**し、60日で schedule が止まるのを防ぐ活動にもなる。
          # **変更履歴は日英そろえて入れる。** 英語版を入れ忘れると、
          # 日本語だけが進んで**両言語が違うことを言う**状態になる。しかも
          # 追跡済みファイルが未ステージで残るので、下の rebase が動かなく
          # なる（2026-09 の run 11 で実際に起きた。全工程が通ったあと、
          # 最後の push だけが落ちて成果が消えた）。
          # **公開しない理由は2つあり、別物である。** limit は「その数字が
          # 母集団を代表していない」、publish=no は「数字は正しいが、出すかを
          # まだ決めていない」。どちらも gold は入れないが、次にすることが違う。
          # **P4 が持ち時間で止まった月の gold は、分母が揃っていない。**
          # 測れた分だけの率を「米国上場企業の率」として出さない
          P4M="data/runs/${{ steps.run.outputs.id }}/p4_measure/_manifest.json"
          p4_incomplete=""
          if [ -f "$P4M" ] && jq -e '[.warnings[].code] | index("STOPPED_AT_TIME_BUDGET")' "$P4M" >/dev/null; then
            p4_incomplete=1
          fi
          # **crt.sh が落ちていて、前の月より分母が小さい月も公開しない**
          # （運営者の判断、2026-10-31。BACKLOG 10）。P7 が印を付ける
          P7M="data/runs/${{ steps.run.outputs.id }}/p7_aggregate/_manifest.json"
          below_previous=""
          if [ -f "$P7M" ] && jq -e '[.warnings[].code] | index("GOLD_BELOW_PREVIOUS_MONTH")' "$P7M" >/dev/null; then
            below_previous=1
          fi
          # **P7 が gold を書かずに止まった月も、公開しない月として扱う。**
          # 前の月ではなく同じ月の既存 gold より分母が小さいとき、P7 は
          # 例外で止まる（DegradedRunError）。2026-11-01 の国内の流し直しで、
          # この経路が「公開する月」の扱いになり、公開していない実行の報告で
          # runs/ の公開済みの報告が上書きされた
          p7_refused=""
          if [ -f "$P7M" ] && [ "$(jq -r '.status' "$P7M")" = "failed" ]; then
            p7_refused=1
          fi
          REPORT="runs/${{ steps.run.outputs.id }}-${{ steps.run.outputs.pop }}.md"
          WORKLIST="runs/${{ steps.run.outputs.id }}-${{ steps.run.outputs.pop }}-worklist.md"
          if [ -n "${{ github.event.inputs.limit }}" ] \
             || [ "${{ github.event.inputs.publish }}" = "no" ] \
             || [ -n "$p4_incomplete" ] \
             || [ -n "$below_previous" ] \
             || [ -n "$p7_refused" ]; then
            # **公開済みの報告を、公開しない実行の報告で上書きしない。**
            # runs/<月>-<母集団>.md は、その月に公開した gold の記録である。
            # 公開しない試行の報告は runs/attempts/ に別名で残す
            if git cat-file -e "HEAD:$REPORT" 2>/dev/null; then
              mkdir -p runs/attempts
              ATTEMPT="runs/attempts/${{ steps.run.outputs.id }}-${{ steps.run.outputs.pop }}-${{ github.run_id }}.md"
              [ -f "$REPORT" ] && mv "$REPORT" "$ATTEMPT"
              git checkout -- "$REPORT" 2>/dev/null || true
              git checkout -- "$WORKLIST" 2>/dev/null || true
              echo "公開済みの報告は残し、この実行の報告は $ATTEMPT に置いた" >> "$GITHUB_STEP_SUMMARY"
            fi
            # 生成時刻しか変わらない訂正履歴も入れない
            git checkout -- runs/corrections-log.md 2>/dev/null || true
            git add runs || true
            # **公開しない月を、変更履歴にも載せない。** 変更履歴は手元の gold
            # から作るので、コミットしない月まで「2026-10」として並ぶ
            # （2026-10 の米国計測を publish=no で回したとき実際に載った）。
            # 作り直した分は捨てる。未ステージで残すと下の rebase も詰まる
            git checkout -- site/src/changelog.md site/src/en/changelog.md 2>/dev/null || true
            {
              echo "### gold はコミットしていない"
              echo
              if [ -n "$p7_refused" ]; then
                echo "P7 が gold を書かずに止まった（同じ月の公開済みの gold より分母が小さいなど）。"
                echo "公開データセットは前の実行のままである。理由は P7 の manifest の error を見ること。"
              elif [ -n "$below_previous" ]; then
                echo "crt.sh が落ちていて、前の月より分母（ドメイン数）が小さいため、"
                echo "公開データセットには入れていない（P7 の警告 GOLD_BELOW_PREVIOUS_MONTH）。"
                echo "**数字は成果物 \`gold-\` から読める。** crt.sh が戻ってから同じ run_id で流し直すこと。"
              elif [ -n "$p4_incomplete" ]; then
                echo "P4 が持ち時間で止まり、測っていないドメインが残っているため、"
                echo "公開データセットには入れていない。同じ run_id を start_from: p4 で流すと続きから測る。"
              elif [ -n "${{ github.event.inputs.limit }}" ]; then
                echo '`--limit ${{ github.event.inputs.limit }}` を指定した動作確認の実行なので、'
                echo "公開データセットには入れていない。全件を出すには limit を空欄にして回すこと。"
              else
                echo "publish: no を指定したため、公開データセットには入れていない。"
                echo "**数字は成果物 \`gold-\` から読める。** 出すと決めたら publish: yes で回し直すこと。"
              fi
              echo
              echo "実行記録は runs/ に残っている。"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            git add gold runs site/src/changelog.md site/src/en/changelog.md || true
          fi
          if git diff --cached --quiet; then
            # 空コミットを作る。60日で schedule が止まるのを防ぐのが目的で、
            # 「今月は数字が動かなかった」ことも記録として意味がある
            git commit --allow-empty -m "月次計測 ${{ steps.run.outputs.id }}（gold に変更なし）"
          else
            git commit -m "月次計測 ${{ steps.run.outputs.id }}"
          fi
          # **実行中に main へ別の push が入ると非早送りで落ちる。**
          # 数時間かけた計測の成果を「押し出せなかった」という理由だけで
          # 失うのは割に合わないので、rebase して数回やり直す。
          # gold は月ごとのファイルなので、他人の変更と内容が衝突しない。
          branch="$(git rev-parse --abbrev-ref HEAD)"
          for attempt in 1 2 3; do
            if git push origin "$branch"; then exit 0; fi
            echo "push に失敗した（$attempt 回目）。rebase してやり直す"
            # **--autostash が無いと、やり直しの仕組みがやり直せない。**
            # 追跡済みファイルに未ステージの変更が1つでもあると
            # `cannot pull with rebase: You have unstaged changes.` で
            # 止まり、3回とも同じ理由で落ちる。上の git add を直しても、
            # 将来また別のファイルが増えたときに同じことが起きる
            git pull --rebase --autostash origin "$branch" || true
            sleep $((attempt * 5))
          done
          echo "::error::gold と実行記録を push できなかった。成果物はこの実行のログにしか無い"
          exit 1

      # **CT の積み残しがあれば、補充を頼む。** 補充は月次計測が走っている間は
      # 何もしない。毎時の schedule が起動しないこともあるので（2026-11-01）、
      # 終わったここから再開させる。--limit の動作確認では頼まない
      - name: CT の補充を頼む
        if: always() && github.event.inputs.limit == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          P="data/cache/crtsh/month=${{ steps.run.outputs.id }}/_pending/${{ steps.run.outputs.pop }}.json"
          n=0
          if [ -f "$P" ]; then n=$(jq '.pending | length' "$P"); fi
          if [ "$n" != "0" ]; then
            gh workflow run ct-backfill.yml --repo "$GITHUB_REPOSITORY" --ref main \
              -f run_id="${{ steps.run.outputs.id }}" || true
            echo "CT の積み残し $n 件。補充を頼んだ" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: 失敗した工程があれば落とす
        run: mailauth run-report --run "${{ steps.run.outputs.id }}" --fail-on-error
