name: 公告掲載方法の外部委託先を洗い出す

# BACKLOG 45。有報の公告掲載方法の URL は、会社自身のサイトのことが多いが、
# 電子公告の掲載を外部に任せる会社は**その事業者のドメイン**を書く（2026-11-06
# の probe で東京海上 HD の欄に www.pronexus.co.jp）。
#
# 公式サイトが分かっている会社の有報を読み、公告の URL のドメインが公式サイトと
# 違うものを数える。**複数の会社に出るドメインは委託先**とみなせる。その一覧を
# 作って、起点の無い会社の経路（edinet_koukoku.py）でページの確かめを省けるか
# 判断する材料にする。
#
# EDINET は API だけ、1秒に1本。手で起こすときだけ動く。結果（ドメインと件数、
# 社名）は成果物に置く（7日）。

on:
  workflow_dispatch:
    inputs:
      month:
        description: 公式サイトを取る月（その月の silver の entities を使う）
        required: false
        default: "2026-11"
      start:
        description: 有報を集める提出日の始まり
        required: false
        default: "2026-06-20"
      end:
        description: 有報を集める提出日の終わり
        required: false
        default: "2026-06-30"
      max_docs:
        description: 読む有報の上限
        required: false
        default: "1500"

permissions:
  contents: read
  actions: read

defaults:
  run:
    shell: bash

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      MAILAUTH_EDINET_SUBSCRIPTION_KEY: ${{ secrets.MAILAUTH_EDINET_SUBSCRIPTION_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 入れる
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: その月の silver を取ってくる
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: silver-jp-all-listed-${{ inputs.month }}
        run: |
          RUN=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$NAME&per_page=20" \
                  --jq '[.artifacts[] | select(.expired | not) | .workflow_run.id] | .[0]')
          gh run download "$RUN" --repo "$GITHUB_REPOSITORY" -n "$NAME" -D silver

      - name: 有報を読む
        env:
          START: ${{ inputs.start }}
          END: ${{ inputs.end }}
          MAX_DOCS: ${{ inputs.max_docs }}
        run: |
          if [ -z "$MAILAUTH_EDINET_SUBSCRIPTION_KEY" ]; then
            echo "key=missing" >> "$GITHUB_STEP_SUMMARY"; exit 1
          fi
          mkdir -p out
          python - <<'PY'
          import datetime as dt, json, os
          from collections import Counter, defaultdict
          import pandas as pd
          from mailauth.p1_population.edinet import USER_AGENT
          from mailauth.p1_population.edinet_koukoku import (
              YUHO, document_text, koukoku_domains, live_api,
          )

          get = live_api(os.environ["MAILAUTH_EDINET_SUBSCRIPTION_KEY"], user_agent=USER_AGENT)
          ents = pd.read_parquet("silver/p1_population/entities.parquet")
          official = {
              r.edinet_code: r.official_domain
              for r in ents.itertuples()
              if r.edinet_code and isinstance(r.official_domain, str)
          }
          names = dict(zip(ents.edinet_code, ents.name))
          day = dt.date.fromisoformat(os.environ["START"])
          end = dt.date.fromisoformat(os.environ["END"])
          docs = []
          while day <= end:
              if day.weekday() < 5:
                  payload = json.loads(get("/documents.json", {"date": day.isoformat(), "type": "2"}))
                  docs += [r for r in payload.get("results") or []
                           if r.get("docTypeCode") == YUHO and r.get("edinetCode") in official
                           and str(r.get("withdrawalStatus") or "0") == "0"]
              day += dt.timedelta(days=1)
          docs = docs[: int(os.environ["MAX_DOCS"])]
          other = defaultdict(set)
          same = differ = none = 0
          for d in docs:
              code = d["edinetCode"]
              try:
                  doms = koukoku_domains(document_text(get(f"/documents/{d['docID']}", {"type": "1"})))
              except Exception:
                  continue
              if not doms:
                  none += 1
                  continue
              if official[code] in doms:
                  same += 1
                  continue
              differ += 1
              for dom in doms:
                  other[dom].add(names.get(code, code))
          vendors = {d: sorted(n) for d, n in other.items() if len(n) >= 2}
          counts = {"docs": len(docs), "url_is_official": same, "url_differs": differ,
                    "no_url": none, "vendor_domains": len(vendors)}
          json.dump({"counts": counts,
                     "vendors": {d: len(n) for d, n in sorted(vendors.items(), key=lambda x: -len(x[1]))},
                     "differ_single": {d: sorted(n) for d, n in other.items() if len(n) == 1}},
                    open("out/vendors.json", "w"), ensure_ascii=False, indent=1)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write("```\n" + json.dumps(counts, ensure_ascii=False, indent=1) + "\n")
              for d, n in sorted(vendors.items(), key=lambda x: -len(x[1]))[:40]:
                  f.write(f"{d}\t{len(n)}\n")
              f.write("```\n")
          print(json.dumps(counts, ensure_ascii=False))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-koukoku-vendors
          path: out/
          retention-days: 7
