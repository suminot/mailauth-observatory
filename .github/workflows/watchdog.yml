name: 起動漏れの見張り

# **起動漏れを拾う**（2026-11-08）。GitHub の schedule は遅れたり落ちたりし、
# 終わり際に次を頼む連鎖も切れる（待てる依頼は1本で、後の依頼が前を取り消す）。
# ここは何も測らない。実行の一覧と gold を見て、来ているはずの起動が無ければ頼む
# （判断は src/mailauth/watchdog.py、検査あり）。
#
# **見張り役も schedule なので、それ自体が抜けることがある。** 補充の毎時の
# schedule（41 分）・連鎖・作業セッションの定期チェックと重ねる。分をずらして
# 1時間に2回（11 分・46 分）起動する。
#
# **schedule はほとんど来ない**（2026-11-08 の実測：11 分・46 分の起動は、加えて
# から 2 時間で1回も無かった。補充の毎時の schedule も、その日は 24 時間で2回）。
# なので**見張り役は終わり際に、25 分待って次の見張り役を頼む**（連鎖）。
# 待てる依頼は1本だけ（concurrency）なので、手で頼んだ分と重なっても連鎖は
# 1本に戻る。連鎖が切れても、schedule と作業セッションの定期チェックが拾い直す。

on:
  schedule:
    - cron: "11,46 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: watchdog
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: 入れる
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: 実行の一覧を取る
        run: |
          for WF in ct-backfill.yml monthly.yml; do
            gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$WF/runs?per_page=30" \
              --jq "[.workflow_runs[] | {workflow: \"$WF\", status, conclusion, created_at, title: .display_title}]"
          done | jq -s 'add' > /tmp/runs.json
          jq 'length' /tmp/runs.json

      - name: 頼むべき起動を決めて頼む
        run: |
          mailauth watchdog --runs /tmp/runs.json > /tmp/actions.jsonl
          if [ ! -s /tmp/actions.jsonl ]; then
            echo "起動漏れは無い" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          while read -r line; do
            wf=$(jq -r '.workflow' <<<"$line")
            reason=$(jq -r '.reason' <<<"$line")
            args=$(jq -r '.inputs | to_entries | map("-f \(.key)=\(.value)") | join(" ")' <<<"$line")
            # shellcheck disable=SC2086
            gh workflow run "$wf" --repo "$GITHUB_REPOSITORY" --ref main $args
            echo "- $wf を頼んだ：$reason" >> "$GITHUB_STEP_SUMMARY"
          done < /tmp/actions.jsonl

      # 次の見張り役を頼む（上の説明）。見張りが失敗しても頼む
      - name: 次の見張りを頼む
        if: always()
        run: |
          sleep 1500
          gh workflow run watchdog.yml --repo "$GITHUB_REPOSITORY" --ref main
          echo "25 分後の見張りを頼んだ" >> "$GITHUB_STEP_SUMMARY"
