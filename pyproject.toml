[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mailauth-observatory"
version = "0.1.0"
description = "Monthly measurement of email authentication (SPF/DKIM/DMARC/BIMI/MTA-STS/TLS-RPT/DNSSEC) for listed companies in Japan and the US"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "Takahiro Sumino"}]

dependencies = [
    "pydantic>=2.6",
    "typer>=0.12",
    "pandas>=2.1",
    "pyarrow>=15.0",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
console = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "duckdb>=0.10",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[project.scripts]
mailauth = "mailauth.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
