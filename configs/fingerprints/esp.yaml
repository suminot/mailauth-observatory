# ESP / マーケティング配信基盤（esp）の判定規則
#
# 業務メールの基盤とは別に、配信専用ドメインで使われることが多い。
# mail_platform と併存しうるので、単一ベンダーに丸めないこと。
version: 2026-09-29
category: esp

rules:
  - id: ses-spf-01
    vendor: Amazon Web Services
    product: Amazon SES
    match:
      record: SPF_INCLUDE
      pattern: '^amazonses\.com$|^.+\.amazonses\.com$'
    confidence: high

  - id: ses-dkim-01
    vendor: Amazon Web Services
    product: Amazon SES
    match:
      record: DKIM_CNAME
      pattern: '\.dkim\.amazonses\.com\.?$'
    confidence: high

  - id: sendgrid-spf-01
    vendor: Twilio
    product: SendGrid
    match:
      record: SPF_INCLUDE
      pattern: '^sendgrid\.net$'
    confidence: high

  - id: mailchimp-spf-01
    vendor: Intuit
    product: Mailchimp
    match:
      record: SPF_INCLUDE
      pattern: '^servers\.mcsv\.net$'
    confidence: high

  - id: mandrill-spf-01
    vendor: Intuit
    product: Mailchimp Transactional (Mandrill)
    match:
      record: SPF_INCLUDE
      pattern: '^spf\.mandrillapp\.com$'
    confidence: high

  - id: salesforce-spf-01
    vendor: Salesforce
    product: Salesforce (Marketing Cloud / Sales Cloud)
    match:
      record: SPF_INCLUDE
      pattern: '^_spf\.salesforce\.com$|^cust-spf\.exacttarget\.com$'
    confidence: high

  - id: hubspot-spf-01
    vendor: HubSpot
    product: HubSpot
    match:
      record: SPF_INCLUDE
      pattern: '^\d+\.spf\d*\.hubspotemail\.net$|^spf\.hubspotemail\.net$'
    confidence: high

  - id: marketo-spf-01
    vendor: Adobe
    product: Marketo Engage
    match:
      record: SPF_INCLUDE
      pattern: '^mktomail\.com$'
    confidence: high

  - id: zendesk-spf-01
    vendor: Zendesk
    product: Zendesk
    match:
      record: SPF_INCLUDE
      pattern: '^mail\.zendesk\.com$'
    confidence: high

  - id: benchmark-spf-jp-01
    vendor: ラクス
    product: 配配メール
    region: JP
    match:
      record: SPF_INCLUDE
      pattern: '^spf\.haihaimail\.jp$'
    confidence: medium
    note: 実測で確認したら confidence を high に上げる

  # -------------------------------------------------------------------------
  # **この2つは別の会社である。**
  #
  # 調査は「シナジーマーケティングは `crmstyle.com`（Synergy!LEAD）と
  # `smp.ne.jp`（Synergy!）の2系統で、合わせて43件。別ベンダーとして
  # 数えると過大になる」と報告していた。**確かめたら違った。**
  #
  # 2026-09-29 の実測:
  #   crmstyle.com  NS: awsdns。SPF は AWS の IP 群
  #   smp.ne.jp     NS: ns.pi-pe.co.jp（パイプドビッツ）。SPF は別の IP 群で
  #                 `include:spf01.smp.ne.jp` を持つ
  #
  # `smp.ne.jp` は SPIRAL（パイプドビッツ）である（`support.smp.ne.jp` が
  # SPIRAL のサポートサイト）。**1社に丸めていたら、他社の顧客を
  # シナジーの顧客として数えるところだった。**
  # -------------------------------------------------------------------------

  - id: synergy-spf-01
    vendor: シナジーマーケティング
    product: Synergy! / Synergy!LEAD
    region: JP
    match:
      record: SPF_INCLUDE
      pattern: '^(.+\.)?crmstyle\.com$'
    confidence: medium

  - id: pipedbits-spf-01
    vendor: パイプドビッツ
    product: SPIRAL
    region: JP
    match:
      record: SPF_INCLUDE
      pattern: '^(spf\d*\.)?smp\.ne\.jp$'
    confidence: medium

  # -------------------------------------------------------------------------
  # 2026-11-04：米国 2026-11 の SPF の include のうち、規則に当たらないものを
  # 頻度順に並べ、**提供元の資料に同じ include が書いてあるものだけ**足した。
  # 足さなかったもの：Pardot（aspmx.pardot.com。Salesforce の頁が読めず、
  # 検索結果の抜粋だけ）、Constant Contact（資料が「include は要らない」と
  # 書いている）、GoDaddy の secureserver.net（1つの include が複数の
  # サービスを指す）、Zoho の one.zoho.com（Zoho の全サービスを指す）、
  # spfhost.messageprovider.com（運営者を資料で確かめられない）
  # -------------------------------------------------------------------------

  - id: knowbe4-spf-01
    vendor: KnowBe4
    product: Security Awareness Training（標的型メール訓練）
    match:
      record: SPF_INCLUDE
      pattern: '^_spf\.psm\.knowbe4\.com$'
    confidence: high
    source: https://support.knowbe4.com/hc/en-us/articles/115003254328
    note: 訓練用の模擬フィッシングメールの送信元。業務メールの基盤ではない

  - id: mailgun-spf-01
    vendor: Sinch
    product: Mailgun
    match:
      record: SPF_INCLUDE
      pattern: '^mailgun\.org$'
    confidence: high
    source: https://documentation.mailgun.com/docs/mailgun/user-manual/domains/domains-verify

  - id: mailjet-spf-01
    vendor: Sinch
    product: Mailjet
    match:
      record: SPF_INCLUDE
      pattern: '^spf\.mailjet\.com$'
    confidence: high
    source: https://documentation.mailjet.com/hc/en-us/articles/360049641733

  - id: oracle-spf-01
    vendor: Oracle
    product: Oracle Cloud（SaaS の通知・OCI Email Delivery）
    match:
      record: SPF_INCLUDE
      pattern: '^spf_c\.oraclecloud\.com$|^((ap|eu)\.)?rp\.oracleemaildelivery\.com$'
    confidence: high
    source: https://docs.oracle.com/en/cloud/saas/transportation/25c/otmca/configuring-spf.html

  - id: netsuite-spf-01
    vendor: Oracle
    product: NetSuite
    match:
      record: SPF_INCLUDE
      pattern: '^sent-via\.netsuite\.com$|^mailsenders\.netsuite\.com$'
    confidence: high
    source: https://docs.oracle.com/en/cloud/saas/netsuite/ns-online-help/bridgehead_4820740297.html

  - id: campaignmonitor-spf-01
    vendor: Marigold
    product: Campaign Monitor
    match:
      record: SPF_INCLUDE
      pattern: '^_spf\.createsend\.com$'
    confidence: high
    source: https://help.campaignmonitor.com/s/article/manage-your-own-authentication

  - id: mailchannels-spf-01
    vendor: MailChannels
    product: MailChannels Outbound Filtering
    match:
      record: SPF_INCLUDE
      pattern: '^relay\.mailchannels\.net$'
    confidence: high
    source: https://docs.mailchannels.com/outbound/spf-records
    note: レンタルサーバー事業者が送信の中継に使う。会社が直接契約しているとは限らない

  - id: atlassian-spf-01
    vendor: Atlassian
    product: Atlassian Cloud（Jira / Confluence の独自ドメインのメール）
    match:
      record: SPF_INCLUDE
      pattern: '^_spf\.atlassian\.net$'
    confidence: high
    source: https://support.atlassian.com/jira/kb/why-dns-checker-for-setting-up-custom-domain-email-address-still-unverified-in-cloud/

  - id: qualtrics-spf-01
    vendor: Qualtrics
    product: Qualtrics（アンケートの配信）
    match:
      record: SPF_INCLUDE
      pattern: '^_spf\.qualtrics\.com$'
    confidence: high
    source: https://www.qualtrics.com/support/survey-platform/distributions-module/email-distribution/using-a-custom-from-address/

  - id: exclaimer-spf-01
    vendor: Exclaimer
    product: Exclaimer（署名の付与）
    match:
      record: SPF_INCLUDE
      pattern: '^spf\.(au|ca|de|eu|uae|uk|us)\.exclaimer\.net$'
    confidence: high
    source: https://support.exclaimer.com/hc/en-gb/articles/4404775962641
    note: 送信メールに署名を付けて送り直す。業務メールが通る

  # 2026-11-04：国内 2026-11 の SPF の include から（提供元の資料で確かめたもの）。
  # 足さなかったもの：ブラストメール（spf.bmv.jp。サイトが不正アクセスで停止中、
  # 検索結果の写しだけ）、SHANON（spf.smktg.jp。頁が 403、写しだけ）、
  # 楽楽明細・ベアメール・SPC・SATORI・Cuenote・BowNow（資料に値が無い）
  - id: emberpoint-spf-01
    vendor: エンバーポイント
    product: MailPublisher など
    region: JP
    match:
      record: SPF_INCLUDE
      pattern: '^spf-(bma|rmb)\.mpme\.jp$'
    confidence: high
    source: https://emberpoint.zendesk.com/hc/ja/articles/4688462786974

  - id: webcas-spf-01
    vendor: WOW WORLD
    product: WEBCAS
    region: JP
    match:
      record: SPF_INCLUDE
      pattern: '^webcas\.net$'
    confidence: high
    source: https://web.webcas.net/content/info/asp12.html

  - id: prtimes-spf-01
    vendor: PR TIMES
    product: PR TIMES（プレスリリースの配信）
    region: JP
    match:
      record: SPF_INCLUDE
      pattern: '^_spf\.prtimes\.jp$'
    confidence: high
    source: https://tayori.com/q/prtimes-faq/detail/627832/

  - id: zohocampaigns-spf-01
    vendor: Zoho
    product: Zoho Campaigns
    match:
      record: SPF_INCLUDE
      pattern: '^zcsend\.net$|^sender\.zcsend\.jp$'
    confidence: high
    source: https://help.zoho.com/portal/ja/kb/campaigns/deliverability-guide/domain-authentication/domain-authentication-techniques
