# メールセキュリティゲートウェイ（security_gateway）の判定規則
#
# ゲートウェイ型は MX を自社に向けさせるため、MX だけでは背後の実基盤が見えない。
# 二段推定（DESIGN.md P6）で SPF include / DKIM CNAME から背後を別途推定すること。
#
# 国内ベンダーの固定ホスト名は未解決事項の筆頭（DESIGN.md 第11章 #1）。
# 運用コンソール画面5の「未知 MX ホスト頻度順リスト」から帰納的に埋めていく。
version: 2026-09-29b
category: security_gateway

rules:
  - id: pp-mx-01
    vendor: Proofpoint
    product: Proofpoint Enterprise Protection
    match:
      record: MX
      # 実測で確認した形は `mxa-00512b01.gslb.pphosted.com`。
      # `mx0a-` 固定・`.gslb` 無しを前提にすると取りこぼす（実データで発見）
      pattern: '^mx0?[ab]-[0-9a-f]{8}(\.gslb)?\.pphosted\.com\.?$'
    confidence: high
    layer: inbound_gateway
    source: dmarc.mx

  - id: pp-mx-03
    vendor: Proofpoint
    match:
      # 系列を特定できない pphosted.com の受け皿。テナント別ホスト名の
      # 命名は変わりうるので、上の詳細な規則から漏れても
      # 「未知ホスト」に落とさないようにしておく
      record: MX
      pattern: '\.pphosted\.com\.?$'
    confidence: medium
    layer: inbound_gateway
    note: 製品系列は特定できていない。pp-mx-01 / pp-mx-02 に一致すればそちらが product を決める

  - id: pp-mx-02
    vendor: Proofpoint
    product: Proofpoint Essentials
    match:
      record: MX
      pattern: '\.ppe-hosted\.com\.?$'
    confidence: high
    layer: inbound_gateway

  - id: mimecast-mx-01
    vendor: Mimecast
    product: Mimecast Email Security
    match:
      record: MX
      pattern: '\.mimecast\.com\.?$|\.mimecast\.co\.za\.?$'
    confidence: high
    layer: inbound_gateway

  - id: cisco-mx-01
    vendor: Cisco
    product: Cisco Secure Email (Cloud Gateway)
    match:
      record: MX
      pattern: '\.iphmx\.com\.?$'
    confidence: high
    layer: inbound_gateway

  - id: barracuda-mx-01
    vendor: Barracuda
    product: Barracuda Email Gateway Defense
    match:
      record: MX
      pattern: '\.barracudanetworks\.com\.?$|\.ess\.barracudanetworks\.com\.?$'
    confidence: high
    layer: inbound_gateway

  - id: trendmicro-mx-01
    vendor: Trend Micro
    product: Trend Micro Email Security
    match:
      record: MX
      pattern: '\.trendmicro\.com\.?$|\.tmes\.trendmicro\.com\.?$'
    confidence: high
    layer: inbound_gateway

  - id: mfilter-spf-01
    vendor: デジタルアーツ
    product: m-FILTER@Cloud
    region: JP
    match:
      record: SPF_INCLUDE
      pattern: '^(_spf1\.)?spf\.mail\.system\.digitalartscloud\.com$'
    confidence: high
    layer: outbound_gateway
    source: daj.jp/bs/serverlist/

  - id: guardianwall-spf-01
    vendor: キヤノンITソリューションズ
    product: GUARDIANWALL メールセキュリティクラウド
    region: JP
    match:
      record: SPF_INCLUDE
      pattern: '^_spf\.guardianwall\.jp$'
    confidence: high
    layer: outbound_gateway

  - id: iij-mx-01
    vendor: IIJ
    product: IIJ セキュアMXサービス
    region: JP
    match:
      record: MX
      pattern: '\.securemx\.jp\.?$'
    confidence: high
    layer: inbound_gateway

  - id: iij-dkim-01
    vendor: IIJ
    product: IIJ セキュアMXサービス
    region: JP
    match:
      # ゲートウェイ独自の署名ドメイン。**実基盤ではない。**
      # dxg.dox.jp はアライメント不可で、これを mail_platform と読むと
      # 「IIJ がメール基盤」という誤った推定になる（DESIGN.md P6 実装メモ）。
      # security_gateway として登録することで前段として正しく扱われる
      record: DKIM_CNAME
      pattern: '(^|\.)d(x|k)g\.dox\.jp\.?$'
    confidence: high
    layer: outbound_gateway
    note: 署名ドメインはゲートウェイのもの。背後の実基盤は SPF include から別途推定する

  - id: hennge-mx-01
    vendor: HENNGE
    product: HENNGE One (Email DLP)
    region: JP
    match:
      record: MX
      pattern: '\.hdemail\.jp\.?$'
    confidence: high
    layer: inbound_gateway

  - id: hennge-spf-01
    vendor: HENNGE
    product: HENNGE One (Email DLP)
    region: JP
    match:
      # **こちらが本命である。** Email DLP は誤送信対策＝**送信側**の製品で、
      # 受信 MX を奪わない。辞書が MX 側（hennge-mx-01）しか持っていなかった
      # ため、国内で2番目に多い痕跡を1件も拾えていなかった。
      #
      # 2026-09 の実測: `spf.mta.hdems.com` 34件 / `*.hdemail.jp` **0件**。
      # 「HENNGE One は MX を握る」という当初の想定は逆だった。
      record: SPF_INCLUDE
      pattern: '^spf\.mta\.hdems\.com$'
    confidence: high
    layer: outbound_gateway
    note: 送信の前段。**受信 MX は別ベンダーのことがある**（実測でシマンテックとの併用あり）

  # -------------------------------------------------------------------------
  # Active! gate SS の一族（OEM）
  #
  # **別の会社が同じ仕組みを売っている。** ベンダー別に数えると1つの製品が
  # 3つに割れて小さく見え、3社を1つに丸めると「どこと契約しているか」が
  # 消える。`engine` を揃えて、**両方を別の数字として出せる**ようにする。
  #
  # 2026-09-29 の実測:
  #   active-w.net          v=spf1 ... include:_spf.activegate-ss.jp ~all
  #   _spf.activegate-ss.jp v=spf1 ip4:223.27.116.0/22 ip4:202.241.206.0/25 …
  #   _spf.sbt-mailgate.jp  v=spf1 ip4:202.241.206.0/25 ip4:223.27.116.0/22 ?all
  #
  # Active! world は**本家の SPF を include している**（IP が似ているどころ
  # ではなく、明示的に参照している）。Mail Safe は本家の2ブロックだけを持つ。
  # 調査は「IP レンジが完全一致」と報告していたが、**一致ではない** ──
  # 本家には個別ホストの ip4 が余分にある。
  # -------------------------------------------------------------------------

  - id: qualitia-mx-01
    vendor: クオリティア
    product: Active! gate SS
    engine: Active! gate SS
    region: JP
    match:
      record: MX
      pattern: '\.activegate-ss\.jp\.?$'
    confidence: high
    layer: inbound_gateway

  - id: qualitia-mx-02
    vendor: クオリティア
    product: Active! zone SS
    region: JP
    match:
      record: MX
      pattern: '\.activezone-ss\.jp\.?$'
    confidence: high
    layer: inbound_gateway
    note: >-
      Active! gate SS と**同じ会社の別製品**（OEM ではない）。SPF の IP
      ブロックが2つとも本家と同じで、TXT の `pardot124481=` も一致する
      （2026-09-29 実測）。`mx11.activezone-ss.jp` は 223.27.118.22 で、
      本家の `223.27.116.0/22` の中にある

  - id: qualitia-spf-01
    vendor: クオリティア
    product: Active! gate SS
    engine: Active! gate SS
    region: JP
    match:
      record: SPF_INCLUDE
      pattern: '^_spf\.activegate-ss\.jp$'
    confidence: high
    layer: outbound_gateway
    note: 送信の前段としての痕跡。MX を握らない構成でも立つ

  - id: mxmobiling-spf-01
    vendor: MXモバイリング
    product: Active! world
    engine: Active! gate SS
    region: JP
    match:
      record: SPF_INCLUDE
      pattern: '^(_spf\d*\.)?active-w\.net$'
    confidence: medium
    layer: outbound_gateway
    note: >-
      `active-w.net` の SPF は本家 `_spf.activegate-ss.jp` を include する
      （2026-09-29 実測）。**受信側の MX は platforms.yaml 側にある**

  - id: sbt-spf-01
    vendor: SBテクノロジー
    product: Mail Safe
    engine: Active! gate SS
    region: JP
    match:
      record: SPF_INCLUDE
      pattern: '^(_spf\.)?sbt-mailgate\.jp$'
    confidence: medium
    layer: outbound_gateway
    note: >-
      Mail Safe は誤送信対策（送信側）。`_spf.sbt-mailgate.jp` は本家と
      同じ2つの IP ブロックだけを持つ（2026-09-29 実測）。**ドメインの
      持ち主は DNS からは確かめられていない**ので medium に留める

  # -------------------------------------------------------------------------
  # 2026-09 の作業リスト（未知 MX の頻度順）から同定したもの
  # -------------------------------------------------------------------------

  - id: trellix-mx-01
    vendor: Trellix
    product: Trellix Email Security – Cloud
    match:
      record: MX
      pattern: '\.email\.fireeyecloud\.com\.?$'
    confidence: high
    layer: inbound_gateway
    note: 旧 FireEye Email Threat Prevention。ホスト名は FireEye 時代のまま

  - id: broadcom-mx-01
    vendor: Broadcom
    product: Symantec Email Security.cloud
    match:
      record: MX
      pattern: '\.messagelabs\.com\.?$'
    confidence: high
    layer: inbound_gateway
    note: 旧 MessageLabs。Symantec 買収を経て現在は Broadcom

  - id: fortinet-mx-01
    vendor: Fortinet
    product: FortiMail Cloud
    match:
      record: MX
      pattern: '\.fortimail\.com\.?$'
    confidence: high
    layer: inbound_gateway
    note: fortimail.com の NS は fortinet.com（2026-09-29 実測）

  - id: mfilter-mx-01
    vendor: デジタルアーツ
    product: m-FILTER@Cloud
    region: JP
    match:
      # SPF 側（mfilter-spf-01）は既にあったが、**MX 側が無かった**。
      # MX を握る構成の12ドメインが未知ホストのまま残っていた
      record: MX
      pattern: '\.system\.digitalartscloud\.com\.?$'
    confidence: high
    layer: inbound_gateway

  - id: fortinet-mx-02
    vendor: Fortinet
    product: FortiMail Cloud
    match:
      # 顧客ごとのホスト名はこちらのドメインに出る。
      # NS は fortinet.com（2026-09-29 実測）
      record: MX
      pattern: '\.fortimailcloud\.com\.?$'
    confidence: high
    layer: inbound_gateway

  - id: tsukaeru-mx-01
    vendor: 使えるねっと
    region: JP
    match:
      record: MX
      pattern: '\.nospamcloud\.com\.?$'
    confidence: medium
    layer: inbound_gateway
    note: nospamcloud.com の NS は ns1/ns2.tsukaeru.ne.jp（2026-09-29 実測）。製品名は特定していない

  - id: tokai-mx-01
    vendor: TOKAIコミュニケーションズ
    product: OneOffice メールソリューション
    region: JP
    match:
      # ホスト名は `mailgw*` で、公式にも「Office365 や Google と組み合わせて
      # 使える」とある。**メールサーバも提供しているので実基盤のこともある** が、
      # 前段に置いておけば背後を二段推定で探せる
      record: MX
      pattern: '\.oneoffice\.jp\.?$'
    confidence: medium
    layer: inbound_gateway
    note: 実基盤としても使われる。SPF / DKIM から背後を別途推定すること

  - id: nec-mx-01
    vendor: NEC
    product: NEC メールセキュリティ
    region: JP
    match:
      record: MX
      pattern: '\.mailsecurity-nec\.jp\.?$'
    confidence: medium
    layer: inbound_gateway

# DNS に痕跡を残さない製品（DESIGN.md P6「API連携型製品という構造的盲点」）
# 「検出されなかった＝使っていない」ではないことを出力とレポートに明示する。
undetectable_by_dns:
  - vendor: Abnormal Security
  - vendor: Check Point
    product: Avanan / Harmony Email & Collaboration
  - vendor: Darktrace
    product: Darktrace EMAIL
  - vendor: Vade
    product: Vade for M365
  - vendor: Perception Point
  - vendor: Agari
