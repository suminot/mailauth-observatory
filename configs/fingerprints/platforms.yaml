# メール基盤（mail_platform）の判定規則
#
# 証拠の強さ: DKIM_CNAME >= MX > SPF_INCLUDE > VERIFICATION_TXT（DESIGN.md P3/P6）
# ゲートウェイ型製品が MX を握っていても、SPF include / DKIM CNAME から
# 背後の実基盤を別カテゴリとして残すこと（原則2。単一ベンダーに丸めない）。
version: 2026-11-01
category: mail_platform

rules:
  - id: m365-mx-01
    vendor: Microsoft
    product: Microsoft 365 (Exchange Online)
    match:
      record: MX
      pattern: '\.mail\.protection\.outlook\.com\.?$'
    confidence: high

  - id: m365-mx-02
    vendor: Microsoft
    product: Microsoft 365 (Exchange Online)
    match:
      # **新形式。** `.microsoft` は Microsoft 自身の TLD で、
      # `mx.microsoft` ゾーンは Azure DNS で運用されている
      # （2026-09-29 に SOA / NS を実測。hostmaster は microsoft.com）
      record: MX
      pattern: '\.mx\.microsoft\.?$'
    confidence: high

  - id: m365-mx-03
    vendor: Microsoft
    product: Microsoft 365 (Exchange Online)
    match:
      # 旧 FOPE 系。2026-09 の実データに6件あり、`outlook.com` の
      # 未知ホストとして作業リストに残っていた
      record: MX
      pattern: '\.mail\.eo\.outlook\.com\.?$'
    confidence: high

  - id: m365-mx-04
    vendor: Microsoft
    match:
      # ドメインを M365 に追加したときの**仮 MX**。メールは流れない。
      # 2026-09 の実データに31件（`ms29696915.msv1.invalid.outlook.com`）
      record: MX
      pattern: '\.msv1\.invalid(\.|$)'
    confidence: low
    # **一致しても「使っている」ことにはならない。** テナントに
    # ドメインは登録済みだが、受信はそこではない ── 第3の状態である。
    # 未知ホストに落とすと辞書を育てる一覧が汚れるので規則にはするが、
    # 利用数からは外す（DESIGN-platform.md §3.1、§5）
    undetectable_reason: tenant_placeholder_mx
    note: M365 にドメイン登録済み。**受信はそこではない**

  - id: m365-spf-01
    vendor: Microsoft
    product: Microsoft 365 (Exchange Online)
    match:
      record: SPF_INCLUDE
      pattern: '^spf\.protection\.outlook\.com$'
    confidence: high

  - id: m365-dkim-01
    vendor: Microsoft
    product: Microsoft 365 (Exchange Online)
    match:
      record: DKIM_CNAME
      pattern: '\.onmicrosoft\.com\.?$'
    confidence: high
    note: 署名基盤。MX が前段ゲートウェイでも実基盤が M365 であることを示す

  - id: m365-dkim-02
    vendor: Microsoft
    product: Microsoft 365 (Exchange Online)
    match:
      record: DKIM_CNAME
      pattern: '\.dkim\.mail\.microsoft\.?$'
    confidence: high
    note: >-
      新形式の DKIM CNAME。**ゾーンの実在は DNS で確かめられない** ──
      `mail.microsoft` は存在しない名前にも NXDOMAIN ではなく NODATA を
      返すため、名前の有無では判定できない（2026-09-29 実測）。
      一致が0件のまま続くなら形式が違う可能性がある

  - id: gws-mx-01
    vendor: Google
    product: Google Workspace
    match:
      # **前の書き方は `aspmx2.l.google.com` を取りこぼしていた。**
      # `aspmx[2-5]` を `.googlemail.com` にだけ効かせていたため、
      # `.l.google.com` 側の連番が1つも当たらない。2026-09 の実測で
      # 作業リストに `aspmx2.l.google.com` が残って見つかった。
      #
      # `gmail-smtp-in.l.google.com` も入れた。本来は @gmail.com 自身の
      # MX だが、独自ドメインに設定されている例が実在する。**綴りとしては
      # Google なので、未知ホストに落とさない。**
      record: MX
      pattern: '^(alt[1-4]\.)?(aspmx\d*|gmail-smtp-in)\.l\.google\.com\.?$|^aspmx\d*\.googlemail\.com\.?$|\.googlemail\.com\.?$'
    confidence: high

  - id: gws-mx-02
    vendor: Google
    product: Google Workspace
    match:
      record: MX
      pattern: '^smtp\.google\.com\.?$'
    confidence: high

  - id: gws-mx-03
    vendor: Google
    match:
      # ドメインを Google Workspace に登録したときの**確認用 MX**。
      # 優先度 15 以上で置き、メールは別の MX に流れる（2026-09 の実データに2件）
      record: MX
      pattern: '\.mx-verification\.google\.com\.?$'
    confidence: low
    # **一致しても「使っている」ことにはならない。** m365-mx-04 と同じ扱い
    undetectable_reason: tenant_placeholder_mx
    note: Google Workspace にドメイン登録済み。**受信はそこではない**

  - id: gws-spf-01
    vendor: Google
    product: Google Workspace
    match:
      record: SPF_INCLUDE
      pattern: '^_spf\.google\.com$'
    confidence: high

  # Zoho の公式資料（2026-10-25 に確認）。データセンターごとに TLD が変わる
  - id: zoho-mx-01
    vendor: Zoho
    product: Zoho Mail
    match:
      record: MX
      pattern: '^mx\d*\.(zoho\.(com|eu|in|jp|sa|com\.au|com\.cn)|zohocloud\.ca)\.?$'
    confidence: high
    source: www.zoho.com/mail/help/adminconsole/configure-email-delivery.html

  # **アプリが受け取るための受信口**であって、業務メールの基盤とは性格が違う。
  # ただ「受信がそこで行われている」ことは事実なので、確度を下げて基盤に入れる
  - id: ses-mx-01
    vendor: Amazon Web Services
    product: Amazon SES (受信)
    match:
      record: MX
      # AWS の公式資料: `inbound-smtp.<リージョン>.amazonaws.com`
      pattern: '^inbound-smtp\.[a-z0-9-]+\.amazonaws\.com\.?$'
    confidence: medium
    source: docs.aws.amazon.com/ses/latest/dg/receiving-email-mx-record.html

  - id: sendgrid-mx-01
    vendor: Twilio
    product: SendGrid (Inbound Parse)
    match:
      record: MX
      pattern: '^mx\.sendgrid\.net\.?$'
    confidence: medium
    note: 受信したメールをアプリに渡す仕組み。業務メールの基盤とは限らない

  - id: cybermail-mx-01
    vendor: サイバーソリューションズ
    product: CYBERMAIL
    region: JP
    match:
      record: MX
      pattern: '\.cybermail\.jp\.?$'
    confidence: high

  - id: sakura-spf-01
    vendor: さくらインターネット
    product: さくらのレンタルサーバ / マネージドサーバ
    region: JP
    match:
      # 専用 include を持たず a: メカニズムで表現される。
      # include 検索だけでは取りこぼす（DESIGN.md P6 実装メモ）
      record: SPF_MECHANISM
      pattern: '^a:www\d+\.sakura\.ne\.jp$'
    confidence: medium

  - id: gmo-spf-01
    vendor: GMOグローバルサイン・ホールディングス
    product: GMOクラウド / お名前.com 系メール
    region: JP
    match:
      record: SPF_INCLUDE
      # 番号付き include はワイルドカード化する（DESIGN.md P6 実装メモ）
      pattern: '^spf\d*\.gmoserver\.jp$'
    confidence: medium

  - id: biglobe-spf-01
    vendor: ビッグローブ
    product: BIGLOBE メール
    region: JP
    match:
      record: SPF_INCLUDE
      pattern: '^spf\d*\.biglobe\.ne\.jp$'
    confidence: medium

  - id: nifty-spf-01
    vendor: ニフティ
    product: "@nifty メール"
    region: JP
    match:
      record: SPF_INCLUDE
      pattern: '^spf\d*\.nifty\.com$'
    confidence: medium

