# 日経225 構成銘柄
#
# **この設定で別に計測はしない。** 構成銘柄は configs/derived_populations.yaml
# で国内上場（jp-all-listed）の会社に印を付け、P7 が別に集計する（2026-11-07）。
# 一覧は Wikipedia の記事（CC BY-SA 4.0）の証券コード。日経の指数サイトは
# 利用規約（情報の蓄積と第三者提供の禁止）のため使わない。
id: jp-nikkei225
label: 日経225構成銘柄
country: JP
enabled: false
implemented: false
blocked_by: 別に計測しない（configs/derived_populations.yaml で国内上場から集計する）

source:
  primary: manual_securities_code_list
  manual_list: null
  # wikidata_identity は gBizINFO のあとに置く。**埋めるのは空欄だけで、
  # 政府の一次情報を上書きしない**（2026-09 の実測で official_url の欠損が
  # 47.7% あり、起点ドメインが無い企業は P2 で候補ゼロになっていた）
  enrich: [houjin_bangou, gbizinfo, wikidata_identity, edinet_koukoku, co_jp_homepage, jawiki_infobox]
  # 法人番号（P3225）で突合して公式サイト（P856）を補う。CC0
  wikidata_identity_query: configs/populations/_sparql/jp_houjin_identity.rq
  industry:
    primary_scheme: EDINET33
    common_mapping: configs/industry/edinet33_to_common12.csv

refresh:
  cadence: monthly
  method: manual

attribution:
  - "Source: Wikidata (CC0)"
  - "出典：ウィキペディア日本語版（CC BY-SA 4.0）── 公式サイトの URL のみ"
