# Fortune 500 (US)
#
# **母集団としては実装しない。ビューとして扱うべきものである。**
#
# Sprint 1.5 で実測した結果、所属リストが CC0 / CC BY-SA のソースから
# 500社規模で再構築できないことが分かった。
#   - Wikidata: Fortune 500 (Q76615) を参照する企業は5社しかない。
#     DESIGN.md の SPARQL が使う P31448 は0件で、実質未整備
#   - Wikipedia「List of largest companies in the United States by revenue」
#     は上位100社まで。CC BY-SA 4.0 なので使えるが500社に足りない
#   - fortune.com はスクレイピングと二次利用を規約で禁止
#
# 計測対象は us-all-listed（SEC EDGAR、6,000社超）にしてある。
# 所属リストが手に入ったら configs/views/ にビューとして足すこと。
# 母集団を変えて計測し直すと月次の比較ができなくなる。
id: us-fortune500
label: Fortune 500 (US)
country: US
enabled: true
implemented: false
blocked_by: 所属リストが CC0 / CC BY-SA のソースから再構築できない。計測は us-all-listed で行い、リストが入手できたらビューとして重ねる

source:
  # fortune.com はスクレイピングと二次利用を規約で禁止
  # 会社名リストは CC0 / パブリックドメインのソースから再構築する
  primary: wikidata
  wikidata_query: configs/populations/_sparql/fortune500.rq
  fallback: wikipedia          # CC BY-SA 4.0（帰属表示が必要）
  enrich:
    - sec_edgar_cik            # company_tickers.json でCIK付与
    - sec_edgar_submissions    # website と SIC を取得
    - gleif_lei
  industry:
    primary_scheme: SIC
    common_mapping: configs/industry/sic_to_common12.csv

refresh:
  # Fortune 500(US) は毎年6月上旬発表、2024会計年度基準
  cadence: annual
  announce_month: 6
  recheck_only_on_announce: true

constraints:
  # 順位と売上高は成果物に含めない（Fortune の編集著作物であるため）
  exclude_fields: [rank, revenue]

acceptance:
  expected_count_min: 480
  expected_count_max: 500

attribution:
  - "Source: Wikidata (CC0)"
  - "Source: U.S. SEC EDGAR (public domain)"
  - "Source: GLEIF"
