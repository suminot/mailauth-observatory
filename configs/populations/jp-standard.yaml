# 東証スタンダード市場上場企業
#
# 未実装。jp-prime と同じ EDINET 経路だが、市場区分で絞るには
# JPX 由来でない証券コード一覧（segment_allowlist）が必要になる。
# それが用意できるまでは jp-all-listed を使うこと。
id: jp-standard
label: 東証スタンダード市場上場企業
country: JP
enabled: false
implemented: false
blocked_by: 市場区分の非JPX由来ソースが未確保（DESIGN.md 未解決事項として扱う）

source:
  primary: edinet_code_list
  market_filter:
    method: securities_code_presence
    segment_source: none
    segment_allowlist: null
  # wikidata_identity は gBizINFO のあとに置く。**埋めるのは空欄だけで、
  # 政府の一次情報を上書きしない**（2026-09 の実測で official_url の欠損が
  # 47.7% あり、起点ドメインが無い企業は P2 で候補ゼロになっていた）
  enrich: [houjin_bangou, gbizinfo, wikidata_identity]
  # 法人番号（P3225）で突合して公式サイト（P856）を補う。CC0
  wikidata_identity_query: configs/populations/_sparql/jp_houjin_identity.rq
  industry:
    primary_scheme: EDINET33
    common_mapping: configs/industry/edinet33_to_common12.csv

refresh:
  cadence: monthly
  method: api

attribution:
  - "出典：EDINET（金融庁）"
  - "Source: Wikidata (CC0)"
