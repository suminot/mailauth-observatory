# 公開の設定（DESIGN.md P8）
#
# 第2層（個社名付き明細）は既定で出さない。訂正期間を経ていない個社明細を
# 公開すると取り返しがつかない（キャッシュもインデックスも残る）ため、
# 「出す」側を明示的な操作にしてある。

site:
  # 公開サイトの生成先。Observable Framework のプロジェクト
  dir: site
  # データローダが読む先。ここに gold から書き出す
  data_dir: site/src/data
  title: Email DNS Monitor
  # 常時表示する限界の明示。vocabulary.DISCLAIMER と一致していること
  disclaimer: 本サイトは標準準拠の計測であり、総合的セキュリティ評価ではない

tier1:
  # 無条件公開。ライセンス上公開可のデータのみ
  enabled: true
  license: CC0-1.0
  formats: [parquet, csv, json]

tier2:
  # 個社名付き明細。**既定で無効。**
  enabled: false
  # 対象企業への事前通知を行った日（YYYY-MM-DD）。未設定なら公開できない
  notified_on: null
  # Cloudflare Access 等の認証が設定済みか。未設定なら公開できない
  access_control_configured: false
  # 訂正申告の受付窓口。第2層を出すなら必須
  correction_contact: null

access:
  # アクセス制御（Cloudflare Access ＋ Entra ID）。
  #
  # **この節は宣言であって証拠ではない。** 実際に認証が掛かっているかは
  # `mailauth access-check` が公開 URL を認証なしで叩いて確かめる。
  # 第2層はその検査に通らない限り公開しない（P8 が停止する）。
  provider: cloudflare_access

  # ログイン方式。null | one_time_pin | entra_id
  #
  # **いまは null ── アクセス制御を設定していない。** 第1層しか出しておらず、
  # 第1層は個社を名指ししないので、試験中にサイトを公開状態で置くこと自体は
  # 設計と矛盾しない（DESIGN.md は第1層を無条件公開と定めている）。
  #
  # **ここを埋めないまま第2層を有効にすることはできない。** P8 は外から
  # 叩いて弾かれることを確かめるまで個社明細を出さない。
  #
  # one_time_pin にするときは allowed_email_domains の条件が必須になる。
  # OTP は「そのアドレスに届くコードを入力できる」ことしか確かめないので、
  # ドメインの条件を入れ忘れると誰のメールアドレスでも通る。entra_id なら
  # 「ログイン方法 = Entra」で最低限テナント内には絞られるが、OTP には
  # その下限が無い
  idp: null

  # 通してよいメールドメイン。**Cloudflare Access のポリシーを
  # 「ログイン方法 = Entra」だけで組むと、そのテナントのゲスト
  # アカウント（外部ドメインのメール）も通る。** 所属で絞るなら
  # メールドメインの条件を別に置くこと。ここはその意図を残すための記録で、
  # 値そのものを検査には使えない（弾かれた側からは誰が通れるか分からない）
  allowed_email_domains:
    - mkilabo.com

  # 認証の内側にあるべきパス。deploy.tier2_path は設定漏れがあっても
  # 自動で加わる。
  #
  # **試験中にサイト全体を閉じるなら "/" を足す。** ただし DESIGN.md は
  # 第1層を無条件公開と定めているので、公開前に外すこと。外し忘れると
  # 「公開している」という前提が静かに崩れるため、"/" が入っている間は
  # 検査が毎回警告を出す
  protected_paths: []

  # 公開サイトの基点 URL（例 https://<プロジェクト名>.pages.dev）。
  # **未設定なら検査できないので、第2層は公開されない**
  #
  # **ここは null のままにしておき、環境変数 MAILAUTH_SITE_BASE_URL で渡す。**
  # 環境変数の方が優先される。これは実在するサイトの住所であって設定の意図では
  # ないので、リポジトリに書き残すと、リポジトリを見た人がそのままサイトに
  # たどり着ける。`noindex` で検索から外してある意図と噛み合わない。
  # GitHub なら Settings → Secrets and variables → Actions → Variables に
  # MAILAUTH_SITE_BASE_URL として置く（秘密ではないので Variables でよい）
  verify_base_url: null

deploy:
  # Cloudflare Pages。認証情報は GitHub の secrets に置く。
  # .github/workflows/deploy.yml が使う。**設定が無ければ何もしない。**
  #   CLOUDFLARE_API_TOKEN      Pages の編集権限
  #   CLOUDFLARE_ACCOUNT_ID
  #   CLOUDFLARE_PAGES_PROJECT  Pages のプロジェクト名
  provider: cloudflare_pages
  project: null
  # 第2層のパス。**Cloudflare Access のポリシーをこのパスに掛ける。**
  # デプロイのワークフローは第1層しか出さないが、第2層を出す段では
  # 認証の内側に置くことが条件になる（tier2.access_control_configured）
  tier2_path: /companies

notify:
  # 事前通知（DESIGN.md Sprint 9）。**既定値は「動かない」側に置いてある。**
  # `mailauth notify-plan` は計画を作るだけで、**メールは送らない。**
  #
  # 送信元ドメイン。**このドメイン自身の SPF/DKIM/DMARC が完全準拠で
  # なければ計画を作らない。** 不備を指摘する通知を、自分が不備な状態で
  # 送ると、その一通で信頼を失う
  sender_domain: null
  # 自分の DKIM セレクタ。**外から網羅はできない。自分のは自分が知っている**
  sender_dkim_selectors: []
  # 本文に載せる URL。**差出人と同一ドメイン上でなければ文面を作らない。**
  # 日本市場では「不審メール扱い」が最初の障壁になるため、受信側が
  # ドメイン名を直接入力して到達できることが要件になる。
  # detail_url は {domain} を含めれば各社分に差し替わる
  detail_url: null
  method_url: null
  # 「今後不要」の返信先。未設定なら tier2.correction_contact を使う
  optout_contact: null
  # オプトアウト登録簿。**読めなければ計画を作らない。**
  # 「読めなかった」を「誰も断っていない」として扱うと、断った相手に送る
  optout_registry: configs/notify/optout.csv
  # 訂正期間。最低30日・推奨60日（DESIGN.md P8）
  correction_days: 60
  # 毎秒1通。相手の受信側に負荷をかけない
  rate_per_sec: 1
  # security.txt を取りに HTTPS を叩くか。false なら「見ていない」と記録する
  # （「無い」とは書かない）
  fetch_security_txt: true

attribution:
  - 金融庁 EDINET コードリスト（政府標準利用規約2.0）
  - 経済産業省 gBizINFO（政府標準利用規約2.0）
  - 国税庁 法人番号公表サイト（公共データ利用規約1.0）
  - Public Suffix List (Mozilla, MPL-2.0)
