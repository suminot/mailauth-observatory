# P2 ドメイン候補生成 / P3 メールドメイン確定のパラメータ
#
# P2 は再現率を優先する。ここで絞ると P3 で拾い直せない。

discovery:
  # 五つの経路（DESIGN.md P2）。個別に切れるようにしてある
  official_url: true      # P1 の official_domain を起点にする
  ct_log: true            # crt.sh。重いので qps を絞る
  # **起点ドメインが無い企業だけに使う。** 証明書の O（組織名）で引く
  ct_org: true
  spf_redirect: true      # SPF の redirect= が別組織を指していれば候補に
  spf_include: true       # SPF の include: が自社サブドメインを指していれば候補に
  dmarc_rua: true         # rua 宛先が自社ドメインなら候補に
  manual: true            # 手動辞書。グループ会社・事業ブランド用

# **サブドメインを捨てない**（BACKLOG 14）。
#
# 実際のメールがサブドメイン上にある企業がある。avex は
# `_dmarc.avex.co.jp` の rua が `av.avex.co.jp` を指していて、
# そちらが**自分の MX と自分の DMARC を持っている。**
#
# 候補としては既に見つけていた。`etld_plus_one()` で `avex.co.jp` に
# 丸めて捨てていただけである ── **見つけられないのではなく、
# 見つけたものを捨てていた。**
#
# 残すのはメールの痕跡から出てきた経路だけにする。CT ログは1社で
# 数百件の名前を返すので、そこから丸ごと残すと P3 / P4 の計測量が
# 桁で増える。**MX を持つかどうかは P3 で見る。**
subdomains:
  enabled: true
  # この経路で見つかったサブドメインだけ残す。他は apex に丸める
  keep_from: [dmarc_rua, spf_redirect, spf_include, manual]
  # 1社あたりの上限。**apex の枠とは別に持つ。**
  # 同じ枠から取ると、サブドメインが apex を押し出して
  # **分母が月ごとに変わる**（前月との比較が効かなくなる）
  max_per_entity: 20

manual_domains: configs/domains/manual_domains.csv

ct:
  # crt.sh は重い。1ドメインあたり数百〜数千の証明書を返すことがある。
  #
  # **qps は相手への礼儀として絞っている。上げない。**
  qps: 0.5
  timeout_sec: 60
  retries: 2
  # 同時に応答を待つ本数。**qps とは別のつまみ。**
  #
  # qps 0.5 は「2秒に1本投げる」であって「1件2秒で終わる」ではない。
  # 直列だと、応答を待っている時間がそのまま実時間になる。
  #
  # **測る場所で答えが変わる。** 片方だけ読むと誤る。
  #
  #   開発機から（2026-09-24、8〜12ドメイン）
  #     直列 9.1秒 / 同時4本 2.4秒 / 同時8本 2.3秒
  #     → ここでは4本で下限（1件2.0秒）に届いている
  #
  #   GitHub Actions から（2026-09、run 35963788831）
  #     同時4本 1件 16.3秒 → **下限の8倍。届いていない**
  #
  # crt.sh は Actions の IP 帯に対して遅い（応答1本あたり約65秒）。
  #
  # **「1件 N秒」はキャッシュ命中を含めた処理件数で割った値で、crt.sh の
  # 応答時間ではない。** run 9（36025105807）を実際に取りにいった件数で
  # 割り直すと 1取得あたり26.3秒、同時4本なので応答1本あたり最大105秒。
  # 失敗率も分母が違う ── 失敗はキャッシュ命中では起きないので
  # 419/722 = **58%** であって、処理件数で割った 22.5% ではない。
  #
  # 下限に届かせるには同時30本前後が要る計算だが、**上げる判断はまだ
  # しない** ── P2 の manifest の breakdown.ct_response を見てから決める。
  # errors_by_kind が timeout に偏っていればドメインの重さ、http /
  # transport に散っていれば相手側の制限で、**手当てが逆になる。**
  #
  # 延期の理由だった「同じ IP から数時間叩くほど悪くなる」は run 8 の
  # 観察（失敗率 序盤4%→終盤25%）で、**run 9 では再現しなかった** ──
  # 最初の30分から55%前後で平ら、取得の速さも5時間を通して平らである。
  #
  # 投げる本数は同時本数によらず 0.5 qps のままで、crt.sh から見た負荷は
  # 直列のときと変わらない（`_throttle` が1つの錠で間隔を守っている）。
  #
  # **2026-09-30、米国 6,068社で答えが出た。** 上の「上げる判断はまだ
  # しない」は、この実測を待っていた。
  #
  #   同時4本  1件 19.2 秒  991/6068 を 5時間16分
  #            この調子なら残り 27時間 → **330分の上限で打ち切られた**
  #
  # **ただし、遅さだけが原因ではなかった。** CT 取得側の内訳を読むと:
  #
  #   [P2 CT取得] 273/1552  5時間08分  1件 67.7秒
  #               （キャッシュ=225 取得=48 失敗=26）
  #
  # 5時間で実際に投げたのは **74本だけ**（うち失敗 26本、失敗率 35%）。
  # 1本あたり 67.7×4 ≒ 270 秒かかっており、これは時間切れ（60秒）＋
  # 投げ直し2回の往復に相当する。**相手が応答していない。**
  #
  # 実際、この前後で crt.sh はトップページごと 502 を返していた
  # （2026-09-30 と 10-01 に確認。2026-09-24 と同じ症状）。
  #
  # `down_after: 20` が働かなかったのは、成功と失敗が交互に来て
  # **20本連続では失敗しなかった**ため。判定としては正しい。
  #
  # 下限に届かせるには「応答時間 ÷ 投げる間隔」本が要る。応答1本あたり
  # 60秒前後なので 30本前後。32 にする。**これで直るのは「待ちが重ならない」
  # ぶんだけで、相手が落ちている間は何をしても取れない。**
  #
  # **これは crt.sh への負荷を増やす変更ではない。** 投げる間隔は
  # 0.5 qps のままで、変わるのは「応答を待つ間に次を投げられるか」だけ。
  concurrency: 32
  # **相手が落ちているなら叩き続けない。**
  #
  # 2026-09-24、crt.sh は**トップページごと 502 Bad Gateway** を返していた
  # （nginx は生きていて後ろが落ちている）。この状態で3,191ドメインを順に
  # 投げても1本も取れない ── 投げ直しに枠を使い切るだけで、しかも落ちて
  # いる相手を叩き続けることになる。
  #
  # これだけ連続して1本も成功しなければ、こちらの頼み方の問題ではない。
  # **止めて、後で出直す。** キャッシュに当たる分はそのまま返るので、
  # 積み上がっているものは失われない。
  #
  # 0 で無効。**下げすぎない** ── たまたま重い数件で止まる。通常の失敗率が
  # 5割でも、20本すべてが失敗する確率は100万分の1に満たない。
  down_after: 20
  # 1社あたり CT から採る候補の上限。爆発を抑える
  max_per_entity: 200

# 組織名で引く経路（BACKLOG 15）。**起点が無い企業だけに使う。**
#
# 2026-09 の国内計測では 628 社（16.3%）に起点が無く、候補ゼロのまま
# 率の分母から外れていた。**メールが無いのではなく、ドメインを見つけられて
# いない。** DESIGN.md は前から「組織名を検索」と書いていたが、実装は
# ドメイン検索だけだった。
#
# `?O=` は**あいまい一致で他社を返す。** 実測（2026-09-29、
# `O=Toyota Motor Corporation`）では1万件中 6,721 件が
# `Toyota Motor Credit Corporation`（別会社）だった。`name_value` が
# 完全に一致する行だけを採る（`ctlog.py` の `_extract_org`）。
ct_org:
  # 1社あたり採るドメイン数の上限
  max_per_entity: 20
  # そのうち何件を DNS 展開（rua / SPF）の起点にも使うか。
  # **0 にすると経路が1本になる**ので、少なくとも1は要る
  dns_seeds_per_entity: 3

limits:
  # 網羅展開の上限（DESIGN.md 1.3）。超えたら打ち切って manifest に記録する
  max_candidates_total: 30000
  # 1社あたりの候補上限。p90 が 50 以下という受け入れ基準に対する安全弁
  max_per_entity: 500

resolver:
  # P2/P3 の軽量問い合わせ用。本格計測（P4）の設定は measure.yaml
  nameservers: []          # 空ならシステム既定
  timeout_sec: 5
  retries: 2
  qps: 20
  # 同時に応答を待つドメイン数。**qps とは別のつまみ。**
  # P3 は1ドメイン3本（MX / TXT / _dmarc）を1本ずつ引いており、
  # 2026-09 の国内計測では 2,158ドメインで23分かかった。往復が直列に
  # 積み上がるためで、qps 20 は効いていない。応答待ちだけを重ねる
  concurrency: 8
  shuffle: true            # 同一権威への連続クエリを避ける
  shuffle_seed: 20260801   # 再現性のため固定。原則6

confidence:
  # 独立した裏付けと見なす発見経路。
  # spf_redirect と dmarc_rua は DNS 由来なので、DNS 一次実証からは独立でない
  independent_methods: [official_url, ct_log, ct_org, manual]

acceptance:
  # DESIGN.md P2 / P3 の受け入れ基準。満たさなくても止めず manifest に記録する
  p2:
    median_per_entity_min: 1
    median_per_entity_max: 5
    p90_per_entity_max: 50
    max_zero_candidate_rate: 0.05
  p3:
    min_confirmed_rate: 0.30
    max_entities_without_confirmed_rate: 0.15
