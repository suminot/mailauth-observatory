# DMARC rua 宛先ドメイン → レポート処理ベンダーの推定
#
# rua の宛先が第三者サービスなら、その企業が DMARC 運用支援サービスを
# 使っていると推定できる。カテゴリは dmarc_vendor。
#
# 国内ベンダーの rua 宛先は dmarc25.jp（TwoFive）以外ほぼ未確認
# （DESIGN.md 第11章 未解決事項 #6）。実測で埋める。
version: 2026-08-01
category: dmarc_vendor

rules:
  - id: rua-twofive-01
    vendor: TwoFive
    product: DMARC/25 Analyze
    region: JP
    match:
      record: DMARC_RUA_DOMAIN
      pattern: '(^|\.)dmarc25\.jp$'
    confidence: high

  - id: rua-valimail-01
    vendor: Valimail
    match:
      record: DMARC_RUA_DOMAIN
      pattern: '(^|\.)valimail\.com$|(^|\.)dmarc-reports\.valimail\.com$'
    confidence: high

  - id: rua-dmarcian-01
    vendor: dmarcian
    match:
      record: DMARC_RUA_DOMAIN
      pattern: '(^|\.)dmarcian\.com$|(^|\.)dmarcian-eu\.com$|(^|\.)dmarcian-ap\.com$'
    confidence: high

  - id: rua-agari-01
    vendor: Agari
    match:
      record: DMARC_RUA_DOMAIN
      pattern: '(^|\.)agari\.com$|(^|\.)dmarc\.agari\.com$'
    confidence: high

  - id: rua-proofpoint-01
    vendor: Proofpoint
    product: Email Fraud Defense
    match:
      record: DMARC_RUA_DOMAIN
      pattern: '(^|\.)emaildefense\.proofpoint\.com$|(^|\.)ppops\.net$'
    confidence: high

  - id: rua-mimecast-01
    vendor: Mimecast
    product: DMARC Analyzer
    match:
      record: DMARC_RUA_DOMAIN
      pattern: '(^|\.)dmarc-analyzer\.com$|(^|\.)mimecast\.com$'
    confidence: high

  - id: rua-easydmarc-01
    vendor: EasyDMARC
    match:
      record: DMARC_RUA_DOMAIN
      pattern: '(^|\.)easydmarc\.com$|(^|\.)report\.easydmarc\.com$'
    confidence: high

  - id: rua-urirportal-01
    vendor: URIports
    match:
      record: DMARC_RUA_DOMAIN
      pattern: '(^|\.)uriports\.com$'
    confidence: high

  - id: rua-postmark-01
    vendor: Postmark
    product: DMARC Digests
    match:
      record: DMARC_RUA_DOMAIN
      pattern: '(^|\.)dmarc\.postmarkapp\.com$'
    confidence: high

  # 実測で確認したもの（2026-08、日本の上場企業17社）。
  # sony.co.jp と fastretailing.com の rua が rua.powerdmarc.com を指していた
  - id: rua-powerdmarc-01
    vendor: PowerDMARC
    match:
      record: DMARC_RUA_DOMAIN
      pattern: '(^|\.)powerdmarc\.com$'
    confidence: high

# 実測で見つかったが**ベンダー名を確認できていない** rua 宛先。
#
# 名前を書かないのは、確認できていないものを断定しないためである
# （原則2 の延長。推察を事実として扱わない）。ベンダー名が分かった時点で
# 上の rules に移し、ここから消す。
#
# ドメイン候補としては P2 が構造的に落としている（複数の無関係な企業が
# 同じ rua 宛先を使っているなら、その全社が所有しているはずがない）。
# つまり**名前が分からなくても他社ドメインの誤計測は起きない。**
# ここに残すのは P6 の dmarc_vendor 推定を埋めるための作業リスト。
unidentified_rua_domains:
  - domain: smtps.jp
    observed_for: [ajinomoto.com, mufg.jp]
    note: 宛先は dmarc.smtps.jp / dp.smtps.jp。テナントごとの不透明なID形式
  - domain: teams.ms
    observed_for: [ajinomoto.com]
    note: 宛先は 471eb9b4.ajinomoto.com@jp.teams.ms。ローカル部に顧客ドメインを含む
